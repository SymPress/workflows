name: WooCommerce QIT

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact produced by wordpress-archive or build-and-distribute.
        type: string
        required: true
      plugin_folder_name:
        description: Plugin folder/slug. Falls back to the repository name.
        type: string
        default: ''
        required: false
      qit_test:
        description: QIT test to run.
        type: string
        default: activation
        required: false
      qit_options:
        description: Additional QIT options.
        type: string
        default: ''
        required: false
      qit_ref:
        description: woocommerce/qit-cli commit, tag, or branch used to download the QIT executable.
        type: string
        default: 2745b88fb76608cd4a5d0e12d8ec4a7609a1a326
        required: false
      qit_sha256:
        description: Optional SHA256 checksum for the downloaded QIT executable.
        type: string
        default: ''
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 10
        required: false
    secrets:
      WOO_PARTNER_USER:
        description: Woo.com partner email.
        required: true
      WOO_PARTNER_SECRET:
        description: Woo.com QIT token.
        required: true

permissions:
  contents: read
  actions: read

jobs:
  woo-qit:
    name: WooCommerce QIT
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      WOO_PARTNER_USER: ${{ secrets.WOO_PARTNER_USER }}
      WOO_PARTNER_SECRET: ${{ secrets.WOO_PARTNER_SECRET }}
      QIT_DISABLE_ONBOARDING: yes
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.artifact_name }}
          path: package

      - name: Prepare plugin data
        id: plugin
        shell: bash
        env:
          INPUT_PLUGIN_FOLDER: ${{ inputs.plugin_folder_name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          plugin_folder="${INPUT_PLUGIN_FOLDER:-$REPOSITORY_NAME}"
          if [[ ! "$plugin_folder" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::plugin_folder_name may only contain letters, numbers, dots, underscores, and hyphens."
            exit 1
          fi
          printf 'folder=%s\n' "$plugin_folder" >> "$GITHUB_OUTPUT"

      - name: Zip artifact
        working-directory: package
        run: zip -r ../plugin.zip .

      - name: Install QIT
        shell: bash
        env:
          QIT_REF: ${{ inputs.qit_ref }}
          QIT_SHA256: ${{ inputs.qit_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$QIT_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$QIT_REF" == *..* ]]; then
            echo "::error::qit_ref may only contain ref-safe characters and must not contain '..'."
            exit 1
          fi
          if [ -n "$QIT_SHA256" ] && [[ ! "$QIT_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "::error::qit_sha256 must be a 64-character SHA256 hex digest."
            exit 1
          fi
          curl -fsSL "https://raw.githubusercontent.com/woocommerce/qit-cli/${QIT_REF}/qit" -o qit
          if [ -n "$QIT_SHA256" ]; then
            printf '%s  qit\n' "$QIT_SHA256" | sha256sum -c -
          fi
          chmod +x qit

      - name: Add QIT auth
        run: ./qit partner:add --user="$WOO_PARTNER_USER" --qit_token="$WOO_PARTNER_SECRET"

      - name: Run QIT
        shell: bash
        env:
          PLUGIN_FOLDER: ${{ steps.plugin.outputs.folder }}
          QIT_OPTIONS: ${{ inputs.qit_options }}
          QIT_TEST: ${{ inputs.qit_test }}
        run: |
          set -euo pipefail
          if [[ ! "$QIT_TEST" =~ ^[A-Za-z0-9:_-]+$ ]]; then
            echo "::error::qit_test may only contain letters, numbers, colons, underscores, and hyphens."
            exit 1
          fi

          args=("run:${QIT_TEST}" "$PLUGIN_FOLDER" "--zip=plugin.zip")
          if [ -n "$QIT_OPTIONS" ]; then
            read -r -a extra_args <<< "$QIT_OPTIONS"
            args+=("${extra_args[@]}")
          fi
          args+=("--print-report-url")

          ./qit "${args[@]}"
