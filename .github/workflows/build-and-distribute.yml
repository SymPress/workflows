name: Build and distribute

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory that contains the package to build.
        type: string
        default: .
        required: false
      package_name:
        description: Package and artifact name. Falls back to repository name.
        type: string
        default: ''
        required: false
      package_version:
        description: Package version. Auto-generated from latest tag, branch, and SHA when empty.
        type: string
        default: ''
        required: false
      built_branch_name:
        description: Target branch for compiled artifacts. Falls back to source branch without source_branch_prefix.
        type: string
        default: ''
        required: false
      source_branch_prefix:
        description: Prefix stripped from source branches when deriving the build branch.
        type: string
        default: dev/
        required: false
      allow_same_branch:
        description: Allow committing build artifacts to the same branch that triggered the workflow.
        type: boolean
        default: false
        required: false
      skip_existing_build:
        description: Skip expensive build steps when the build branch already contains the source SHA.
        type: boolean
        default: true
        required: false
      allow_github_ssh_keyscan:
        description: Allow ssh-keyscan fallback for github.com when GITHUB_KNOWN_HOSTS is not provided.
        type: boolean
        default: false
        required: false
      php_version:
        description: PHP version used for Composer.
        type: string
        default: '8.5'
        required: false
      php_extensions:
        description: Extensions passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      php_tools:
        description: Additional tools passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      node_version:
        description: Node version used for frontend builds.
        type: string
        default: '24'
        required: false
      node_options:
        description: NODE_OPTIONS value.
        type: string
        default: ''
        required: false
      npm_registry_domain:
        description: npm registry URL.
        type: string
        default: https://npm.pkg.github.com/
        required: false
      composer_options:
        description: Options passed to Composer install.
        type: string
        default: --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction
        required: false
      build_script:
        description: npm/yarn/pnpm build script to run.
        type: string
        default: build
        required: false
      run_asset_compiler:
        description: Run Composer compile-assets if available.
        type: boolean
        default: true
        required: false
      asset_compiler_args:
        description: Arguments passed to composer compile-assets.
        type: string
        default: -v --env=root
        required: false
      run_php_scoper:
        description: Run PHP-Scoper when scoper.inc.php exists.
        type: boolean
        default: true
        required: false
      update_composer_version:
        description: Write package_version to composer.json when present.
        type: boolean
        default: true
        required: false
      update_package_json_version:
        description: Write package_version to package.json when present.
        type: boolean
        default: true
        required: false
      update_wordpress_headers:
        description: Write package_version and SHA to plugin/theme headers when detected.
        type: boolean
        default: true
        required: false
      pre_script:
        description: Shell code executed before build steps.
        type: string
        default: ''
        required: false
      allow_inline_scripts:
        description: Allow pre_script execution. Keep disabled for untrusted callers.
        type: boolean
        default: false
        required: false
      artifact_allowed_env_files:
        description: Whitespace-separated .env files that may be shipped. Add .env only when it is intentionally non-secret.
        type: string
        default: .env.example .env.dist
        required: false
      artifact_extra_excludes:
        description: Additional whitespace-separated rsync exclude patterns for the artifact.
        type: string
        default: ''
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 20
        required: false
    secrets:
      COMPOSER_AUTH_JSON:
        description: Composer authentication JSON.
        required: false
      NPM_REGISTRY_TOKEN:
        description: npm registry token.
        required: false
      GITHUB_USER_EMAIL:
        description: Git author email.
        required: false
      GITHUB_USER_NAME:
        description: Git author name.
        required: false
      GITHUB_USER_SSH_KEY:
        description: Optional SSH key used for checkout and push.
        required: false
      GITHUB_KNOWN_HOSTS:
        description: Trusted known_hosts entry for github.com when pushing via SSH.
        required: false
      GITHUB_USER_TOKEN:
        description: Optional token used for pushing the build branch.
        required: false
      ENV_VARS:
        description: JSON object or array of {name,value} variables to export.
        required: false
    outputs:
      artifact:
        description: Uploaded artifact name.
        value: ${{ jobs.build-and-distribute.outputs.artifact }}
      built_branch:
        description: Branch that received the compiled build.
        value: ${{ jobs.build-and-distribute.outputs.built_branch }}
      package_version:
        description: Version used for the build.
        value: ${{ jobs.build-and-distribute.outputs.package_version }}
      skipped_existing_build:
        description: Whether an existing build branch with the same source SHA was reused.
        value: ${{ jobs.build-and-distribute.outputs.skipped_existing_build }}

permissions:
  contents: write

jobs:
  build-and-distribute:
    name: Build and distribute
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    concurrency:
      group: build-and-distribute-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
      built_branch: ${{ steps.metadata.outputs.built_branch }}
      package_version: ${{ steps.metadata.outputs.package_version }}
      skipped_existing_build: ${{ steps.existing-build.outputs.exists }}
    env:
      COMPOSER_MIRROR_PATH_REPOS: 1
      NODE_OPTIONS: ${{ inputs.node_options }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start SSH agent
        env:
          SSH_KEY: ${{ secrets.GITHUB_USER_SSH_KEY }}
        if: ${{ env.SSH_KEY != '' }}
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ env.SSH_KEY }}

      - name: Configure push remote
        shell: bash
        env:
          SSH_KEY: ${{ secrets.GITHUB_USER_SSH_KEY }}
          GITHUB_KNOWN_HOSTS: ${{ secrets.GITHUB_KNOWN_HOSTS }}
          ALLOW_GITHUB_SSH_KEYSCAN: ${{ inputs.allow_github_ssh_keyscan }}
          PUSH_TOKEN: ${{ secrets.GITHUB_USER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$SSH_KEY" ]; then
            mkdir -p ~/.ssh
            touch ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            if [ -n "$GITHUB_KNOWN_HOSTS" ]; then
              printf '%s\n' "$GITHUB_KNOWN_HOSTS" >> ~/.ssh/known_hosts
            elif [ "$ALLOW_GITHUB_SSH_KEYSCAN" = "true" ]; then
              ssh-keyscan github.com >> ~/.ssh/known_hosts
            else
              echo "::error::GITHUB_KNOWN_HOSTS is required for SSH push unless allow_github_ssh_keyscan=true is explicitly set."
              exit 1
            fi
            git remote set-url origin "git@github.com:${{ github.repository }}.git"
          elif [ -n "$PUSH_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          fi

      - name: Configure Git author
        shell: bash
        env:
          GIT_EMAIL: ${{ secrets.GITHUB_USER_EMAIL }}
          GIT_NAME: ${{ secrets.GITHUB_USER_NAME }}
        run: |
          set -euo pipefail
          git config user.email "${GIT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git config user.name "${GIT_NAME:-github-actions[bot]}"
          git config advice.addIgnoredFile false

      - name: Export custom environment
        env:
          ENV_VARS_JSON: ${{ secrets.ENV_VARS }}
        if: ${{ env.ENV_VARS_JSON != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const raw = process.env.ENV_VARS_JSON || '';
            const data = JSON.parse(raw);
            const items = Array.isArray(data)
              ? data
              : Object.entries(data).map(([name, value]) => ({ name, value }));

            for (const item of items) {
              core.setSecret(String(item.value));
              core.exportVariable(item.name, String(item.value));
            }

      - name: Determine build metadata
        id: metadata
        shell: bash
        env:
          INPUT_PACKAGE_VERSION: ${{ inputs.package_version }}
          INPUT_BUILT_BRANCH: ${{ inputs.built_branch_name }}
          SOURCE_BRANCH_PREFIX: ${{ inputs.source_branch_prefix }}
          ALLOW_SAME_BRANCH: ${{ inputs.allow_same_branch }}
        run: |
          set -euo pipefail

          source_branch="${GITHUB_REF_NAME}"
          built_branch="$INPUT_BUILT_BRANCH"
          if [ -z "$built_branch" ]; then
            built_branch="${source_branch#"$SOURCE_BRANCH_PREFIX"}"
          fi

          if [ "$ALLOW_SAME_BRANCH" != "true" ] && [ "$source_branch" = "$built_branch" ]; then
            echo "::error::Build branch equals source branch. Use a prefixed source branch or set allow_same_branch=true."
            exit 1
          fi

          package_version="$INPUT_PACKAGE_VERSION"
          if [ -z "$package_version" ]; then
            latest_tag="$(git tag --sort=-v:refname | head -n 1 || true)"
            base="${latest_tag#v}"
            if [ -z "$base" ]; then
              base="0.0.0"
            fi
            slug="$(echo "${source_branch#"$SOURCE_BRANCH_PREFIX"}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')"
            if [ -z "$slug" ]; then
              slug="build"
            fi
            short_sha="$(git rev-parse --short=8 HEAD)"
            package_version="${base}-${slug}.${short_sha}"
          fi

          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "built_branch=$built_branch"
            echo "package_version=$package_version"
          } >> "$GITHUB_OUTPUT"

      - name: Check existing build
        id: existing-build
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
          BUILT_BRANCH: ${{ steps.metadata.outputs.built_branch }}
          SKIP_EXISTING_BUILD: ${{ inputs.skip_existing_build }}
        run: |
          set -euo pipefail
          echo "exists=false" >> "$GITHUB_OUTPUT"

          if [ "$SKIP_EXISTING_BUILD" != "true" ]; then
            exit 0
          fi

          if ! git ls-remote --exit-code --heads origin "$BUILT_BRANCH" >/dev/null 2>&1; then
            exit 0
          fi

          git fetch --depth=1 origin "$BUILT_BRANCH"
          if git grep -Eq "(^|[[:space:]])SHA:[[:space:]]*$SOURCE_SHA([[:space:]]|$)" FETCH_HEAD -- '*.php' 'style.css' 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout build branch
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
          BUILT_BRANCH: ${{ steps.metadata.outputs.built_branch }}
          EXISTING_BUILD: ${{ steps.existing-build.outputs.exists }}
        run: |
          set -euo pipefail

          if [ "$EXISTING_BUILD" = "true" ]; then
            git fetch --depth=1 origin "$BUILT_BRANCH"
            git checkout -B "$BUILT_BRANCH" "origin/$BUILT_BRANCH"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$BUILT_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BUILT_BRANCH"
            git checkout -B "$BUILT_BRANCH" "origin/$BUILT_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            git clean -ffdx
          else
            git checkout --orphan "$BUILT_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            git clean -ffdx
          fi

          git checkout "$SOURCE_SHA" -- .

      - name: Detect project files
        id: detect
        if: ${{ steps.existing-build.outputs.exists != 'true' }}
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          test -f "$WD/composer.json" && echo "has_composer=true" >> "$GITHUB_OUTPUT" || echo "has_composer=false" >> "$GITHUB_OUTPUT"
          test -f "$WD/package.json" && echo "has_package_json=true" >> "$GITHUB_OUTPUT" || echo "has_package_json=false" >> "$GITHUB_OUTPUT"

      - name: Detect package manager
        id: package-manager
        if: ${{ steps.existing-build.outputs.exists != 'true' && steps.detect.outputs.has_package_json == 'true' }}
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          path_for() {
            if [ "$WD" = "." ]; then
              printf '%s' "$1"
            else
              printf '%s/%s' "${WD%/}" "$1"
            fi
          }

          if [ -f "$(path_for pnpm-lock.yaml)" ]; then
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for yarn.lock)" ]; then
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for yarn.lock)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for package-lock.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for package-lock.json)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for npm-shrinkwrap.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for npm-shrinkwrap.json)" >> "$GITHUB_OUTPUT"
          else
            echo "cache=" >> "$GITHUB_OUTPUT"
            echo "lockfile=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP
        if: ${{ steps.existing-build.outputs.exists != 'true' && steps.detect.outputs.has_composer == 'true' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2, php-scoper, ${{ inputs.php_tools }}
          coverage: none

      - name: Install Composer dependencies
        if: ${{ steps.existing-build.outputs.exists != 'true' && steps.detect.outputs.has_composer == 'true' }}
        uses: ramsey/composer-install@v3
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
        with:
          working-directory: ${{ inputs.working_directory }}
          composer-options: ${{ inputs.composer_options }}

      - name: Set up Node
        if: ${{ steps.existing-build.outputs.exists != 'true' && steps.detect.outputs.has_package_json == 'true' && steps.package-manager.outputs.cache == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}

      - name: Set up Node with cache
        if: ${{ steps.existing-build.outputs.exists != 'true' && steps.detect.outputs.has_package_json == 'true' && steps.package-manager.outputs.cache != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}
          cache: ${{ steps.package-manager.outputs.cache }}
          cache-dependency-path: ${{ steps.package-manager.outputs.lockfile }}

      - name: Install Node dependencies
        if: ${{ steps.existing-build.outputs.exists != 'true' && steps.detect.outputs.has_package_json == 'true' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable || yarn install --frozen-lockfile
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Update versions
        if: ${{ steps.existing-build.outputs.exists != 'true' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
          UPDATE_COMPOSER: ${{ inputs.update_composer_version }}
          UPDATE_PACKAGE_JSON: ${{ inputs.update_package_json_version }}
          UPDATE_WORDPRESS_HEADERS: ${{ inputs.update_wordpress_headers }}
        run: |
          set -euo pipefail

          if [ "$UPDATE_COMPOSER" = "true" ] && [ -f composer.json ]; then
            jq --arg version "$PACKAGE_VERSION" '.version = $version' composer.json > composer.json.tmp
            mv composer.json.tmp composer.json
          fi

          if [ "$UPDATE_PACKAGE_JSON" = "true" ] && [ -f package.json ]; then
            jq --arg version "$PACKAGE_VERSION" '.version = $version' package.json > package.json.tmp
            mv package.json.tmp package.json
          fi

          if [ "$UPDATE_WORDPRESS_HEADERS" = "true" ]; then
            main_file=""
            if [ -f style.css ] && grep -q '^Theme Name:' style.css; then
              main_file="style.css"
            else
              main_file="$(grep -rl --include='*.php' '^ \{0,\}\* \{0,\}Plugin Name:' . 2>/dev/null | head -n 1 || true)"
              if [ -z "$main_file" ]; then
                main_file="$(grep -rl --include='*.php' '^Plugin Name:' . 2>/dev/null | head -n 1 || true)"
              fi
            fi

            if [ -n "$main_file" ] && [ -f "$main_file" ]; then
              sed -i -E "s/^([[:space:]]*(\\*[[:space:]]*)?Version:[[:space:]]*).*/\\1$PACKAGE_VERSION/" "$main_file"
              if grep -Eq '^[[:space:]]*(\*[[:space:]]*)?SHA:' "$main_file"; then
                sed -i -E "s/^([[:space:]]*(\\*[[:space:]]*)?SHA:[[:space:]]*).*/\\1${{ github.sha }}/" "$main_file"
              elif grep -Eq '^[[:space:]]*(\*[[:space:]]*)?Version:' "$main_file"; then
                tmp_file="$(mktemp)"
                awk -v sha="${{ github.sha }}" '
                  {
                    print
                  }
                  !inserted && /^[[:space:]]*(\*[[:space:]]*)?Version:/ {
                    prefix = $0
                    sub(/Version:.*/, "", prefix)
                    print prefix "SHA: " sha
                    inserted = 1
                  }
                ' "$main_file" > "$tmp_file"
                mv "$tmp_file" "$main_file"
              fi
            fi
          fi

      - name: Execute pre script
        if: ${{ steps.existing-build.outputs.exists != 'true' && inputs.pre_script != '' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          ALLOW_INLINE_SCRIPTS: ${{ inputs.allow_inline_scripts }}
          PRE_SCRIPT: ${{ inputs.pre_script }}
        run: |
          set -euo pipefail
          if [ "$ALLOW_INLINE_SCRIPTS" != "true" ]; then
            echo "::error::pre_script is disabled by default. Set allow_inline_scripts=true only for trusted workflow calls."
            exit 1
          fi

          bash -euo pipefail -c "$PRE_SCRIPT"

      - name: Run Composer asset compiler
        if: ${{ steps.existing-build.outputs.exists != 'true' && steps.detect.outputs.has_composer == 'true' && inputs.run_asset_compiler }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          ASSET_COMPILER_ARGS: ${{ inputs.asset_compiler_args }}
        run: |
          set -euo pipefail
          if composer run-script --list | grep -Eq '^[[:space:]]+compile-assets[[:space:]]'; then
            # shellcheck disable=SC2086
            composer compile-assets $ASSET_COMPILER_ARGS
          else
            echo "Composer compile-assets script not found."
          fi

      - name: Run Node build
        if: ${{ steps.existing-build.outputs.exists != 'true' && steps.detect.outputs.has_package_json == 'true' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          BUILD_SCRIPT: ${{ inputs.build_script }}
        run: |
          set -euo pipefail
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts[process.env.BUILD_SCRIPT] ? 0 : 1)"; then
            echo "No $BUILD_SCRIPT script found."
            exit 0
          fi

          if [ -f pnpm-lock.yaml ]; then
            pnpm "$BUILD_SCRIPT"
          elif [ -f yarn.lock ]; then
            yarn "$BUILD_SCRIPT"
          else
            npm run "$BUILD_SCRIPT"
          fi

      - name: Run PHP-Scoper
        if: ${{ steps.existing-build.outputs.exists != 'true' && steps.detect.outputs.has_composer == 'true' && inputs.run_php_scoper }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scoper.inc.php ]; then
            echo "No scoper.inc.php found."
            exit 0
          fi

          php-scoper add-prefix --force --output-dir=.scoped-build
          composer --working-dir=.scoped-build dump-autoload -o
          if [ -f ".scoped-build/vendor/composer/autoload_real.php" ]; then
            sed -i "s/'__composer_autoload_files'/\'__composer_autoload_files_${{ github.sha }}'/g" ".scoped-build/vendor/composer/autoload_real.php"
          fi
          rsync -a .scoped-build/ ./
          rm -rf .scoped-build

      - name: Prepare artifact
        id: package
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          INPUT_PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
          ARTIFACT_ALLOWED_ENV_FILES: ${{ inputs.artifact_allowed_env_files }}
          ARTIFACT_EXTRA_EXCLUDES: ${{ inputs.artifact_extra_excludes }}
        run: |
          set -euo pipefail
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi

          package_name="${INPUT_PACKAGE_NAME:-${{ github.event.repository.name }}}"
          artifact="${package_name}-${PACKAGE_VERSION}"

          rm -rf .artifact
          mkdir -p ".artifact/$package_name"

          allowed_env_files=()
          while IFS= read -r line; do
            for env_file in $line; do
              env_file="${env_file#./}"
              [ -n "$env_file" ] && allowed_env_files+=("$env_file")
            done
          done <<< "$ARTIFACT_ALLOWED_ENV_FILES"

          rsync_args=(
            -a
            --delete
            --exclude='.git'
            --exclude='.github'
            --exclude='.ddev'
            --exclude='.artifact'
            --exclude='.npmrc'
            --exclude='auth.json'
            --exclude='composer-auth.json'
            --exclude='.ssh'
            --exclude='id_rsa'
            --exclude='id_ed25519'
            --exclude='known_hosts'
            --exclude='*.pem'
            --exclude='*.key'
            --exclude='*.p12'
            --exclude='*.pfx'
            --exclude='*.kubeconfig'
            --exclude='secrets.*'
            --exclude='node_modules'
            --exclude='.phpunit.cache'
            --exclude='var/cache'
          )

          if [ -f .distignore ]; then
            rsync_args+=(--exclude-from=.distignore)
          fi

          while IFS= read -r line; do
            for pattern in $line; do
              [ -n "$pattern" ] && rsync_args+=(--exclude="$pattern")
            done
          done <<< "$ARTIFACT_EXTRA_EXCLUDES"

          for env_file in "${allowed_env_files[@]}"; do
            rsync_args+=(--include="/$env_file")
          done
          rsync_args+=(--exclude='.env*')

          rsync "${rsync_args[@]}" ./ ".artifact/$package_name/"

          is_allowed_env_file() {
            local file="$1"
            local allowed
            for allowed in "${allowed_env_files[@]}"; do
              if [ "$file" = "$allowed" ]; then
                return 0
              fi
            done
            return 1
          }

          leaks=()
          while IFS= read -r -d '' file; do
            rel="${file#".artifact/$package_name/"}"
            base="${rel##*/}"
            case "$base" in
              .env*)
                if ! is_allowed_env_file "$rel"; then
                  leaks+=("$rel")
                fi
                ;;
              .npmrc|auth.json|composer-auth.json|id_rsa|id_ed25519|known_hosts|*.pem|*.key|*.p12|*.pfx|*.kubeconfig|secrets.*)
                leaks+=("$rel")
                ;;
            esac

            if [[ "$rel" == .ssh/* || "$rel" == */.ssh/* ]]; then
              leaks+=("$rel")
            fi
          done < <(find ".artifact/$package_name" -type f -print0)

          if [ "${#leaks[@]}" -gt 0 ]; then
            echo "::error::Artifact contains blocked secret-like files. Extend artifact_allowed_env_files only for intentionally non-secret .env files."
            printf 'Blocked artifact path: %s\n' "${leaks[@]}"
            exit 1
          fi

          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Commit build branch
        if: ${{ steps.existing-build.outputs.exists != 'true' }}
        shell: bash
        env:
          BUILT_BRANCH: ${{ steps.metadata.outputs.built_branch }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No build branch changes to commit."
            exit 0
          fi

          git commit -m "Build artifact ${PACKAGE_VERSION} from ${GITHUB_REF_NAME}" --no-verify
          git push origin "HEAD:${BUILT_BRANCH}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ format('{0}/.artifact/*', inputs.working_directory) }}
          include-hidden-files: true
          compression-level: 9
