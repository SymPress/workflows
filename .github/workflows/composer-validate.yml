name: Composer validate and audit

on:
  workflow_call:
    inputs:
      php_version:
        description: PHP version used for Composer.
        type: string
        default: '8.5'
        required: false
      php_extensions:
        description: Extensions passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      working_directory:
        description: Directory that contains composer.json.
        type: string
        default: .
        required: false
      install:
        description: Install dependencies before validation and audit.
        type: boolean
        default: false
        required: false
      composer_options:
        description: Options passed to Composer install.
        type: string
        default: --prefer-dist --no-progress --no-interaction
        required: false
      audit:
        description: Run Composer audit.
        type: boolean
        default: true
        required: false
      validate_options:
        description: Options passed to composer validate.
        type: string
        default: --strict --no-check-publish
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 5
        required: false
    secrets:
      COMPOSER_AUTH_JSON:
        description: Composer authentication JSON.
        required: false
      ENV_VARS:
        description: JSON object or array of {name,value} variables to export.
        required: false

permissions:
  contents: read

jobs:
  composer-validate:
    name: Composer validate and audit
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Export custom environment
        env:
          ENV_VARS_JSON: ${{ secrets.ENV_VARS }}
        if: ${{ env.ENV_VARS_JSON != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const raw = process.env.ENV_VARS_JSON || '';
            const data = JSON.parse(raw);
            const items = Array.isArray(data)
              ? data
              : Object.entries(data).map(([name, value]) => ({ name, value }));
            const blockedNames = new Set([
              'BASH_ENV',
              'ENV',
              'GITHUB_ENV',
              'GITHUB_OUTPUT',
              'GITHUB_PATH',
              'LD_PRELOAD',
              'NODE_OPTIONS',
              'PATH',
            ]);

            for (const item of items) {
              const name = String(item.name || '');
              if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
                core.setFailed(`Invalid environment variable name: ${name}`);
                return;
              }
              if (/^(GITHUB_|ACTIONS_|RUNNER_)/.test(name) || blockedNames.has(name)) {
                core.setFailed(`Refusing to override reserved environment variable: ${name}`);
                return;
              }
              core.setSecret(String(item.value));
              core.exportVariable(name, String(item.value));
            }

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        if: ${{ inputs.install }}
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
        with:
          working-directory: ${{ inputs.working_directory }}
          composer-options: ${{ inputs.composer_options }}

      - name: Validate composer.json
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          VALIDATE_OPTIONS: ${{ inputs.validate_options }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$VALIDATE_OPTIONS" ]; then
            read -r -a args <<< "$VALIDATE_OPTIONS"
          fi
          composer validate "${args[@]}"

      - name: Audit Composer dependencies
        if: ${{ inputs.audit }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f composer.lock ]; then
            composer audit --locked --no-interaction
          else
            composer audit --no-interaction
          fi
