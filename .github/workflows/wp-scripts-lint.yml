name: WordPress scripts lint

on:
  workflow_call:
    inputs:
      node_version:
        description: Node version used for linting.
        type: string
        default: '24'
        required: false
      node_options:
        description: NODE_OPTIONS value.
        type: string
        default: ''
        required: false
      npm_registry_domain:
        description: npm registry URL.
        type: string
        default: https://npm.pkg.github.com/
        required: false
      allow_unpinned_node_install:
        description: Allow npm install when no lockfile exists. Keep disabled for reproducible CI.
        type: boolean
        default: false
        required: false
      working_directory:
        description: Directory that contains package.json.
        type: string
        default: .
        required: false
      lint_tools:
        description: JSON array containing js, style, md-docs, and/or pkg-json.
        type: string
        default: '["js","style","md-docs"]'
        required: false
      eslint_args:
        description: Arguments passed to wp-scripts lint-js.
        type: string
        default: ''
        required: false
      stylelint_args:
        description: Arguments passed to wp-scripts lint-style.
        type: string
        default: ''
        required: false
      markdownlint_args:
        description: Arguments passed to wp-scripts lint-md-docs.
        type: string
        default: ''
        required: false
      package_jsonlint_args:
        description: Arguments passed to wp-scripts lint-pkg-json.
        type: string
        default: ''
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 8
        required: false
    secrets:
      NPM_REGISTRY_TOKEN:
        description: npm registry token.
        required: false
      GITHUB_USER_EMAIL:
        description: Git user email for private package setups.
        required: false
      GITHUB_USER_NAME:
        description: Git user name for private package setups.
        required: false
      GITHUB_USER_SSH_KEY:
        description: SSH key for private package setups.
        required: false
      ENV_VARS:
        description: JSON object or array of {name,value} variables to export.
        required: false

permissions:
  contents: read

jobs:
  wp-scripts-lint:
    name: WordPress scripts lint
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      NODE_OPTIONS: ${{ inputs.node_options }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
      ALLOW_UNPINNED_NODE_INSTALL: ${{ inputs.allow_unpinned_node_install }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Export custom environment
        env:
          ENV_VARS_JSON: ${{ secrets.ENV_VARS }}
        if: ${{ env.ENV_VARS_JSON != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const raw = process.env.ENV_VARS_JSON || '';
            const data = JSON.parse(raw);
            const items = Array.isArray(data)
              ? data
              : Object.entries(data).map(([name, value]) => ({ name, value }));
            const blockedNames = new Set([
              'BASH_ENV',
              'ENV',
              'GITHUB_ENV',
              'GITHUB_OUTPUT',
              'GITHUB_PATH',
              'LD_PRELOAD',
              'NODE_OPTIONS',
              'PATH',
            ]);

            for (const item of items) {
              const name = String(item.name || '');
              if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
                core.setFailed(`Invalid environment variable name: ${name}`);
                return;
              }
              if (/^(GITHUB_|ACTIONS_|RUNNER_)/.test(name) || blockedNames.has(name)) {
                core.setFailed(`Refusing to override reserved environment variable: ${name}`);
                return;
              }
              core.setSecret(String(item.value));
              core.exportVariable(name, String(item.value));
            }

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.GITHUB_USER_SSH_KEY }}
        if: ${{ env.SSH_KEY != '' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ env.SSH_KEY }}

      - name: Set up Git
        env:
          GIT_EMAIL: ${{ secrets.GITHUB_USER_EMAIL }}
          GIT_NAME: ${{ secrets.GITHUB_USER_NAME }}
        if: ${{ env.GIT_EMAIL != '' && env.GIT_NAME != '' }}
        run: |
          git config --global user.email "$GIT_EMAIL"
          git config --global user.name "$GIT_NAME"

      - name: Detect package manager
        id: package-manager
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          path_for() {
            if [ "$WD" = "." ]; then
              printf '%s' "$1"
            else
              printf '%s/%s' "${WD%/}" "$1"
            fi
          }

          if [ -f "$(path_for pnpm-lock.yaml)" ]; then
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for yarn.lock)" ]; then
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for yarn.lock)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for package-lock.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for package-lock.json)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for npm-shrinkwrap.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for npm-shrinkwrap.json)" >> "$GITHUB_OUTPUT"
          else
            echo "cache=" >> "$GITHUB_OUTPUT"
            echo "lockfile=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: ${{ steps.package-manager.outputs.cache == '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}

      - name: Set up Node with cache
        if: ${{ steps.package-manager.outputs.cache != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}
          cache: ${{ steps.package-manager.outputs.cache }}
          cache-dependency-path: ${{ steps.package-manager.outputs.lockfile }}

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable || yarn install --frozen-lockfile
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            if [ "${ALLOW_UNPINNED_NODE_INSTALL:-false}" != "true" ]; then
              echo "::error::No JavaScript lockfile found. Add pnpm-lock.yaml, yarn.lock, package-lock.json, or npm-shrinkwrap.json, or set allow_unpinned_node_install=true for trusted callers."
              exit 1
            fi
            npm install
          fi

      - name: Lint JavaScript
        if: ${{ contains(fromJSON(inputs.lint_tools), 'js') }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          LINT_ARGS: ${{ inputs.eslint_args }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$LINT_ARGS" ]; then
            read -r -a args <<< "$LINT_ARGS"
          fi
          ./node_modules/.bin/wp-scripts lint-js "${args[@]}"

      - name: Lint styles
        if: ${{ contains(fromJSON(inputs.lint_tools), 'style') }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          LINT_ARGS: ${{ inputs.stylelint_args }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$LINT_ARGS" ]; then
            read -r -a args <<< "$LINT_ARGS"
          fi
          ./node_modules/.bin/wp-scripts lint-style "${args[@]}"

      - name: Lint Markdown
        if: ${{ contains(fromJSON(inputs.lint_tools), 'md-docs') }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          LINT_ARGS: ${{ inputs.markdownlint_args }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$LINT_ARGS" ]; then
            read -r -a args <<< "$LINT_ARGS"
          fi
          ./node_modules/.bin/wp-scripts lint-md-docs "${args[@]}"

      - name: Lint package.json
        if: ${{ contains(fromJSON(inputs.lint_tools), 'pkg-json') }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          LINT_ARGS: ${{ inputs.package_jsonlint_args }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$LINT_ARGS" ]; then
            read -r -a args <<< "$LINT_ARGS"
          fi
          ./node_modules/.bin/wp-scripts lint-pkg-json "${args[@]}"
