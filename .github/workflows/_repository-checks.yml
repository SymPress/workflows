name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  workflow-security:
    name: Audit workflow security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          persona: auditor
          min-severity: medium
          advanced-security: 'false'
          annotations: 'true'

  docs:
    name: Lint documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown
        run: npm run lint:docs

  contracts:
    name: Validate workflow contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate contracts
        run: npm run test:contracts

      - name: Verify generated workflow interfaces
        run: npm run check:interfaces

      - name: Run workflow doctor fixture scan
        run: npm run doctor -- --fail-on high fixtures/wp-plugin

      - name: Run workflow doctor repository gate
        run: npm run doctor:repo

  fixture-composer:
    name: Fixture Composer validate
    uses: ./.github/workflows/composer-validate.yml
    with:
      working_directory: fixtures/php-package
      install: true
      audit: false

  fixture-monorepo-qa:
    name: Fixture monorepo QA
    uses: ./.github/workflows/sympress-qa.yml
    with:
      include_root: false
      package_glob: fixtures/monorepo/packages/*
      run_audit: false
      run_phpunit: false

  fixture-archive:
    name: Fixture WordPress archive
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/wordpress-archive.yml
    with:
      working_directory: fixtures/wp-plugin
      package_name: sympress-fixture-plugin
      package_version: 0.1.0
      run_node_build: false

  fixture-archive-check:
    name: Fixture WordPress archive check
    needs: fixture-archive
    uses: ./.github/workflows/wordpress-archive-check.yml
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: read
    with:
      artifact_name: ${{ needs.fixture-archive.outputs.artifact }}
      run_plugin_review: false

  consumer-contracts:
    name: Consumer contract (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            repository: SymPress/cli
          - name: demo
            repository: SymPress/demo
          - name: kernel
            repository: SymPress/kernel
    steps:
      - name: Checkout workflows
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout consumer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ matrix.repository }}
          path: .canary/${{ matrix.name }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate consumer calls
        run: npm run test:consumers -- .canary/${{ matrix.name }}
