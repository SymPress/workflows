name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  workflow-security:
    name: Audit workflow security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          persona: auditor
          min-severity: medium
          advanced-security: 'false'
          annotations: 'true'

  docs:
    name: Lint documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown
        run: npm run lint:docs

  contracts:
    name: Validate workflow contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate contracts
        run: npm run test:contracts

      - name: Run workflow doctor fixture scan
        run: npm run doctor -- --fail-on high fixtures/wp-plugin

      - name: Run workflow doctor repository gate
        run: npm run doctor:repo

  fixture-composer:
    name: Fixture Composer validate
    uses: ./.github/workflows/composer-validate.yml
    with:
      working_directory: fixtures/php-package
      install: true
      audit: false

  fixture-monorepo-qa:
    name: Fixture monorepo QA
    uses: ./.github/workflows/sympress-qa.yml
    with:
      include_root: false
      package_glob: fixtures/monorepo/packages/*
      run_audit: false
      run_phpunit: false

  fixture-archive:
    name: Fixture WordPress archive
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/wordpress-archive.yml
    with:
      working_directory: fixtures/wp-plugin
      package_name: sympress-fixture-plugin
      package_version: 0.1.0
      run_node_build: false

  fixture-archive-check:
    name: Fixture WordPress archive check
    needs: fixture-archive
    uses: ./.github/workflows/wordpress-archive-check.yml
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: read
    with:
      artifact_name: ${{ needs.fixture-archive.outputs.artifact }}
      run_plugin_review: false
