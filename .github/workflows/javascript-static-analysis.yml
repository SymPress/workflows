name: JavaScript static analysis

on:
  workflow_call:
    inputs:
      node_version:
        description: Node version used for static analysis.
        type: string
        default: '24'
        required: false
      node_options:
        description: NODE_OPTIONS value.
        type: string
        default: ''
        required: false
      npm_registry_domain:
        description: npm registry URL.
        type: string
        default: https://npm.pkg.github.com/
        required: false
      allow_unpinned_node_install:
        description: Allow npm install when no lockfile exists. Keep disabled for reproducible CI.
        type: boolean
        default: false
        required: false
      working_directory:
        description: Directory that contains package.json.
        type: string
        default: .
        required: false
      command:
        description: Explicit command to run instead of auto-detecting a script.
        type: string
        default: ''
        required: false
      allow_custom_command:
        description: Allow command execution. Keep disabled for untrusted callers.
        type: boolean
        default: false
        required: false
      script:
        description: Preferred package script for static analysis.
        type: string
        default: typecheck
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 8
        required: false
    secrets:
      NPM_REGISTRY_TOKEN:
        description: npm registry token.
        required: false
      GITHUB_USER_EMAIL:
        description: Git user email for private package setups.
        required: false
      GITHUB_USER_NAME:
        description: Git user name for private package setups.
        required: false
      GITHUB_USER_SSH_KEY:
        description: SSH key for private package setups.
        required: false
      ENV_VARS:
        description: JSON object or array of {name,value} variables to export.
        required: false

permissions:
  contents: read

jobs:
  javascript-static-analysis:
    name: JavaScript static analysis
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      NODE_OPTIONS: ${{ inputs.node_options }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
      ALLOW_UNPINNED_NODE_INSTALL: ${{ inputs.allow_unpinned_node_install }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Export custom environment
        env:
          ENV_VARS_JSON: ${{ secrets.ENV_VARS }}
        if: ${{ env.ENV_VARS_JSON != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const raw = process.env.ENV_VARS_JSON || '';
            const data = JSON.parse(raw);
            const items = Array.isArray(data)
              ? data
              : Object.entries(data).map(([name, value]) => ({ name, value }));
            const blockedNames = new Set([
              'BASH_ENV',
              'ENV',
              'GITHUB_ENV',
              'GITHUB_OUTPUT',
              'GITHUB_PATH',
              'LD_PRELOAD',
              'NODE_OPTIONS',
              'PATH',
            ]);

            for (const item of items) {
              const name = String(item.name || '');
              if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
                core.setFailed(`Invalid environment variable name: ${name}`);
                return;
              }
              if (/^(GITHUB_|ACTIONS_|RUNNER_)/.test(name) || blockedNames.has(name)) {
                core.setFailed(`Refusing to override reserved environment variable: ${name}`);
                return;
              }
              core.setSecret(String(item.value));
              core.exportVariable(name, String(item.value));
            }

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.GITHUB_USER_SSH_KEY }}
        if: ${{ env.SSH_KEY != '' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ env.SSH_KEY }}

      - name: Set up Git
        env:
          GIT_EMAIL: ${{ secrets.GITHUB_USER_EMAIL }}
          GIT_NAME: ${{ secrets.GITHUB_USER_NAME }}
        if: ${{ env.GIT_EMAIL != '' && env.GIT_NAME != '' }}
        run: |
          git config --global user.email "$GIT_EMAIL"
          git config --global user.name "$GIT_NAME"

      - name: Detect package manager
        id: package-manager
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          path_for() {
            if [ "$WD" = "." ]; then
              printf '%s' "$1"
            else
              printf '%s/%s' "${WD%/}" "$1"
            fi
          }

          if [ -f "$(path_for pnpm-lock.yaml)" ]; then
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for yarn.lock)" ]; then
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for yarn.lock)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for package-lock.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for package-lock.json)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for npm-shrinkwrap.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for npm-shrinkwrap.json)" >> "$GITHUB_OUTPUT"
          else
            echo "cache=" >> "$GITHUB_OUTPUT"
            echo "lockfile=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: ${{ steps.package-manager.outputs.cache == '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}

      - name: Set up Node with cache
        if: ${{ steps.package-manager.outputs.cache != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}
          cache: ${{ steps.package-manager.outputs.cache }}
          cache-dependency-path: ${{ steps.package-manager.outputs.lockfile }}

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable || yarn install --frozen-lockfile
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            if [ "${ALLOW_UNPINNED_NODE_INSTALL:-false}" != "true" ]; then
              echo "::error::No JavaScript lockfile found. Add pnpm-lock.yaml, yarn.lock, package-lock.json, or npm-shrinkwrap.json, or set allow_unpinned_node_install=true for trusted callers."
              exit 1
            fi
            npm install
          fi

      - name: Run static analysis
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
          ALLOW_CUSTOM_COMMAND: ${{ inputs.allow_custom_command }}
          SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail

          if [ -n "$COMMAND" ]; then
            if [ "$ALLOW_CUSTOM_COMMAND" != "true" ]; then
              echo "::error::command is disabled by default. Set allow_custom_command=true only for trusted workflow calls."
              exit 1
            fi
            bash -lc "$COMMAND"
            exit 0
          fi

          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts[process.env.SCRIPT] ? 0 : 1)"; then
            if [ -f pnpm-lock.yaml ]; then
              pnpm "$SCRIPT"
            elif [ -f yarn.lock ]; then
              yarn "$SCRIPT"
            else
              npm run "$SCRIPT"
            fi
            exit 0
          fi

          if [ -x node_modules/.bin/tsc ]; then
            ./node_modules/.bin/tsc --noEmit --skipLibCheck --pretty false
            exit 0
          fi

          echo "No static analysis script or TypeScript binary found."
