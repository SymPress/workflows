name: WordPress archive

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory that contains the plugin or theme.
        type: string
        default: .
        required: false
      php_version:
        description: PHP version used for Composer.
        type: string
        default: '8.5'
        required: false
      php_extensions:
        description: Extensions passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      node_version:
        description: Node version used for frontend builds.
        type: string
        default: '24'
        required: false
      npm_registry_domain:
        description: npm registry URL.
        type: string
        default: https://npm.pkg.github.com/
        required: false
      allow_unpinned_node_install:
        description: Allow npm install when no lockfile exists. Keep disabled for reproducible CI.
        type: boolean
        default: false
        required: false
      composer_options:
        description: Options passed to Composer install.
        type: string
        default: --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction
        required: false
      package_name:
        description: Artifact name. Falls back to the repository name.
        type: string
        default: ''
        required: false
      package_folder:
        description: Folder name inside the artifact. Falls back to package_name.
        type: string
        default: ''
        required: false
      package_version:
        description: Optional version written to plugin/theme headers.
        type: string
        default: ''
        required: false
      main_file:
        description: Main plugin file or theme style.css. Auto-detected when empty.
        type: string
        default: ''
        required: false
      run_node_build:
        description: Run package build script when package.json exists.
        type: boolean
        default: true
        required: false
      build_script:
        description: npm/yarn/pnpm script to run.
        type: string
        default: build
        required: false
      pre_script:
        description: Shell code executed before staging the archive.
        type: string
        default: ''
        required: false
      allow_inline_scripts:
        description: Allow pre_script execution. Keep disabled for untrusted callers.
        type: boolean
        default: false
        required: false
      artifact_allowed_env_files:
        description: Whitespace-separated .env files that may be shipped. Add .env only when it is intentionally non-secret.
        type: string
        default: .env.example .env.dist
        required: false
      artifact_extra_excludes:
        description: Additional whitespace-separated rsync exclude patterns for the artifact.
        type: string
        default: ''
        required: false
      artifact_secret_scan:
        description: Scan staged artifact files for common secret patterns before upload.
        type: boolean
        default: true
        required: false
      artifact_manifest:
        description: Add artifact-manifest.json and artifact-sha256sums.txt to the archive.
        type: boolean
        default: true
        required: false
      artifact_attestation:
        description: 'Attest artifact-manifest.json with GitHub Artifact Attestations. Requires caller permissions actions: read, attestations: write, and id-token: write.'
        type: boolean
        default: false
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 15
        required: false
    secrets:
      COMPOSER_AUTH_JSON:
        description: Composer authentication JSON.
        required: false
      NPM_REGISTRY_TOKEN:
        description: npm registry token.
        required: false
      ENV_VARS:
        description: JSON object or array of {name,value} variables to export.
        required: false
    outputs:
      artifact:
        description: Uploaded artifact name.
        value: ${{ jobs.wordpress-archive.outputs.artifact }}

permissions:
  contents: read

jobs:
  wordpress-archive:
    name: WordPress archive
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
    env:
      COMPOSER_MIRROR_PATH_REPOS: 1
      NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
      ALLOW_UNPINNED_NODE_INSTALL: ${{ inputs.allow_unpinned_node_install }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect project files
        id: detect
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          test -f "$WD/composer.json" && echo "has_composer=true" >> "$GITHUB_OUTPUT" || echo "has_composer=false" >> "$GITHUB_OUTPUT"
          test -f "$WD/package.json" && echo "has_package_json=true" >> "$GITHUB_OUTPUT" || echo "has_package_json=false" >> "$GITHUB_OUTPUT"

      - name: Detect package manager
        id: package-manager
        if: ${{ steps.detect.outputs.has_package_json == 'true' && inputs.run_node_build }}
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          path_for() {
            if [ "$WD" = "." ]; then
              printf '%s' "$1"
            else
              printf '%s/%s' "${WD%/}" "$1"
            fi
          }

          if [ -f "$(path_for pnpm-lock.yaml)" ]; then
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for yarn.lock)" ]; then
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for yarn.lock)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for package-lock.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for package-lock.json)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for npm-shrinkwrap.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for npm-shrinkwrap.json)" >> "$GITHUB_OUTPUT"
          else
            echo "cache=" >> "$GITHUB_OUTPUT"
            echo "lockfile=" >> "$GITHUB_OUTPUT"
          fi

      - name: Export custom environment
        env:
          ENV_VARS_JSON: ${{ secrets.ENV_VARS }}
        if: ${{ env.ENV_VARS_JSON != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const raw = process.env.ENV_VARS_JSON || '';
            const data = JSON.parse(raw);
            const items = Array.isArray(data)
              ? data
              : Object.entries(data).map(([name, value]) => ({ name, value }));
            const blockedNames = new Set([
              'BASH_ENV',
              'ENV',
              'GITHUB_ENV',
              'GITHUB_OUTPUT',
              'GITHUB_PATH',
              'LD_PRELOAD',
              'NODE_OPTIONS',
              'PATH',
            ]);

            for (const item of items) {
              const name = String(item.name || '');
              if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
                core.setFailed(`Invalid environment variable name: ${name}`);
                return;
              }
              if (/^(GITHUB_|ACTIONS_|RUNNER_)/.test(name) || blockedNames.has(name)) {
                core.setFailed(`Refusing to override reserved environment variable: ${name}`);
                return;
              }
              core.setSecret(String(item.value));
              core.exportVariable(name, String(item.value));
            }

      - name: Set up PHP
        if: ${{ steps.detect.outputs.has_composer == 'true' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        if: ${{ steps.detect.outputs.has_composer == 'true' }}
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
        with:
          working-directory: ${{ inputs.working_directory }}
          composer-options: ${{ inputs.composer_options }}

      - name: Set up Node
        if: ${{ steps.detect.outputs.has_package_json == 'true' && inputs.run_node_build && steps.package-manager.outputs.cache == '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}

      - name: Set up Node with cache
        if: ${{ steps.detect.outputs.has_package_json == 'true' && inputs.run_node_build && steps.package-manager.outputs.cache != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}
          cache: ${{ steps.package-manager.outputs.cache }}
          cache-dependency-path: ${{ steps.package-manager.outputs.lockfile }}

      - name: Install Node dependencies
        if: ${{ steps.detect.outputs.has_package_json == 'true' && inputs.run_node_build }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable || yarn install --frozen-lockfile
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            if [ "${ALLOW_UNPINNED_NODE_INSTALL:-false}" != "true" ]; then
              echo "::error::No JavaScript lockfile found. Add pnpm-lock.yaml, yarn.lock, package-lock.json, or npm-shrinkwrap.json, or set allow_unpinned_node_install=true for trusted callers."
              exit 1
            fi
            npm install
          fi

      - name: Run Node build
        if: ${{ steps.detect.outputs.has_package_json == 'true' && inputs.run_node_build }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          BUILD_SCRIPT: ${{ inputs.build_script }}
        run: |
          set -euo pipefail
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts[process.env.BUILD_SCRIPT] ? 0 : 1)"; then
            echo "No $BUILD_SCRIPT script found."
            exit 0
          fi

          if [ -f pnpm-lock.yaml ]; then
            pnpm "$BUILD_SCRIPT"
          elif [ -f yarn.lock ]; then
            yarn "$BUILD_SCRIPT"
          else
            npm run "$BUILD_SCRIPT"
          fi

      - name: Execute pre script
        if: ${{ inputs.pre_script != '' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          ALLOW_INLINE_SCRIPTS: ${{ inputs.allow_inline_scripts }}
          PRE_SCRIPT: ${{ inputs.pre_script }}
        run: |
          set -euo pipefail
          if [ "$ALLOW_INLINE_SCRIPTS" != "true" ]; then
            echo "::error::pre_script is disabled by default. Set allow_inline_scripts=true only for trusted workflow calls."
            exit 1
          fi

          bash -euo pipefail -c "$PRE_SCRIPT"

      - name: Prepare package metadata
        id: package
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          INPUT_PACKAGE_NAME: ${{ inputs.package_name }}
          INPUT_PACKAGE_FOLDER: ${{ inputs.package_folder }}
          INPUT_MAIN_FILE: ${{ inputs.main_file }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          package_name="${INPUT_PACKAGE_NAME:-$REPOSITORY_NAME}"
          package_folder="${INPUT_PACKAGE_FOLDER:-$package_name}"
          main_file="$INPUT_MAIN_FILE"

          if [ -z "$main_file" ]; then
            if [ -f style.css ] && grep -q '^Theme Name:' style.css; then
              main_file="style.css"
            else
              main_file="$(grep -rl --include='*.php' '^ \{0,\}\* \{0,\}Plugin Name:' . 2>/dev/null | head -n 1 || true)"
              if [ -z "$main_file" ]; then
                main_file="$(grep -rl --include='*.php' '^Plugin Name:' . 2>/dev/null | head -n 1 || true)"
              fi
            fi
          fi

          if [ -n "$PACKAGE_VERSION" ] && [ -n "$main_file" ] && [ -f "$main_file" ]; then
            sed -i -E "s/^([[:space:]]*(\\*[[:space:]]*)?Version:[[:space:]]*).*/\\1$PACKAGE_VERSION/" "$main_file"
            if grep -Eq '^[[:space:]]*(\*[[:space:]]*)?SHA:' "$main_file"; then
              sed -i -E "s/^([[:space:]]*(\\*[[:space:]]*)?SHA:[[:space:]]*).*/\\1$SOURCE_SHA/" "$main_file"
            fi
          fi

          artifact="${package_name}${PACKAGE_VERSION:+-$PACKAGE_VERSION}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "folder=$package_folder" >> "$GITHUB_OUTPUT"

      - name: Stage archive
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          PACKAGE_FOLDER: ${{ steps.package.outputs.folder }}
          ARTIFACT_ALLOWED_ENV_FILES: ${{ inputs.artifact_allowed_env_files }}
          ARTIFACT_EXTRA_EXCLUDES: ${{ inputs.artifact_extra_excludes }}
          ARTIFACT_SECRET_SCAN: ${{ inputs.artifact_secret_scan }}
          ARTIFACT_MANIFEST: ${{ inputs.artifact_manifest }}
          ARTIFACT_ATTESTATION: ${{ inputs.artifact_attestation }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$ARTIFACT_ATTESTATION" = "true" ] && [ "$ARTIFACT_MANIFEST" != "true" ]; then
            echo "::error::artifact_attestation requires artifact_manifest=true because the manifest is the attestation subject."
            exit 1
          fi

          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi

          rm -rf .dist
          mkdir -p ".dist/$PACKAGE_FOLDER"

          allowed_env_files=()
          while IFS= read -r line; do
            for env_file in $line; do
              env_file="${env_file#./}"
              [ -n "$env_file" ] && allowed_env_files+=("$env_file")
            done
          done <<< "$ARTIFACT_ALLOWED_ENV_FILES"

          rsync_args=(
            -a
            --delete
            --exclude='.git'
            --exclude='.github'
            --exclude='.ddev'
            --exclude='.dist'
            --exclude='.npmrc'
            --exclude='auth.json'
            --exclude='composer-auth.json'
            --exclude='.ssh'
            --exclude='id_rsa'
            --exclude='id_ed25519'
            --exclude='known_hosts'
            --exclude='*.pem'
            --exclude='*.key'
            --exclude='*.p12'
            --exclude='*.pfx'
            --exclude='*.kubeconfig'
            --exclude='secrets.*'
            --exclude='node_modules'
            --exclude='.phpunit.cache'
            --exclude='var/cache'
          )

          if [ -f .distignore ]; then
            rsync_args+=(--exclude-from=.distignore)
          fi

          while IFS= read -r line; do
            for pattern in $line; do
              [ -n "$pattern" ] && rsync_args+=(--exclude="$pattern")
            done
          done <<< "$ARTIFACT_EXTRA_EXCLUDES"

          for env_file in "${allowed_env_files[@]}"; do
            rsync_args+=(--include="/$env_file")
          done
          rsync_args+=(--exclude='.env*')

          rsync "${rsync_args[@]}" ./ ".dist/$PACKAGE_FOLDER/"

          is_allowed_env_file() {
            local file="$1"
            local allowed
            for allowed in "${allowed_env_files[@]}"; do
              if [ "$file" = "$allowed" ]; then
                return 0
              fi
            done
            return 1
          }

          leaks=()
          while IFS= read -r -d '' file; do
            rel="${file#".dist/$PACKAGE_FOLDER/"}"
            base="${rel##*/}"
            case "$base" in
              .env*)
                if ! is_allowed_env_file "$rel"; then
                  leaks+=("$rel")
                fi
                ;;
              .npmrc|auth.json|composer-auth.json|id_rsa|id_ed25519|known_hosts|*.pem|*.key|*.p12|*.pfx|*.kubeconfig|secrets.*)
                leaks+=("$rel")
                ;;
            esac

            if [[ "$rel" == .ssh/* || "$rel" == */.ssh/* ]]; then
              leaks+=("$rel")
            fi
          done < <(find ".dist/$PACKAGE_FOLDER" -type f -print0)

          if [ "${#leaks[@]}" -gt 0 ]; then
            echo "::error::Artifact contains blocked secret-like files. Extend artifact_allowed_env_files only for intentionally non-secret .env files."
            printf 'Blocked artifact path: %s\n' "${leaks[@]}"
            exit 1
          fi

          if [ "$ARTIFACT_SECRET_SCAN" = "true" ]; then
            secret_pattern='-----BEGIN ([A-Z ]+)?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{36,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]+'
            mapfile -t secret_hits < <(grep -RIEIl --binary-files=without-match -- "$secret_pattern" ".dist/$PACKAGE_FOLDER" || true)
            if [ "${#secret_hits[@]}" -gt 0 ]; then
              echo "::error::Artifact content matched a blocked secret pattern."
              printf 'Secret-like artifact path: %s\n' "${secret_hits[@]}"
              exit 1
            fi
          fi

          if [ "$ARTIFACT_MANIFEST" = "true" ]; then
            stage_dir=".dist/$PACKAGE_FOLDER"
            checksum_file="$stage_dir/artifact-sha256sums.txt"
            manifest_file="$stage_dir/artifact-manifest.json"
            tmp_checksums="$(mktemp)"
            rm -f "$checksum_file" "$manifest_file"
            (
              cd "$stage_dir"
              find . -type f ! -name artifact-sha256sums.txt ! -name artifact-manifest.json -print0 \
                | sort -z \
                | xargs -0 -r sha256sum > "$tmp_checksums"
            )
            mv "$tmp_checksums" "$checksum_file"
            jq -n \
              --arg schema "https://sympress.dev/schemas/artifact-manifest-v1.json" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg source_sha "$GITHUB_SHA" \
              --arg source_ref "$GITHUB_REF_NAME" \
              --arg workflow_ref "$WORKFLOW_REF" \
              --arg run_id "$RUN_ID" \
              --arg package_folder "$PACKAGE_FOLDER" \
              --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg checksums "artifact-sha256sums.txt" \
              '{
                schema: $schema,
                repository: $repository,
                source_sha: $source_sha,
                source_ref: $source_ref,
                workflow_ref: $workflow_ref,
                run_id: $run_id,
                package_folder: $package_folder,
                generated_at: $generated_at,
                checksums: $checksums
              }' > "$manifest_file"
          fi

      - name: Upload archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ format('{0}/.dist/*', inputs.working_directory) }}
          include-hidden-files: true
          compression-level: 9

  artifact-attestation:
    name: Attest artifact manifest
    needs: wordpress-archive
    if: ${{ inputs.artifact_attestation }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Download archive artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.wordpress-archive.outputs.artifact }}
          path: attestation-subject

      - name: Locate artifact manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find attestation-subject -name artifact-manifest.json -type f | sort)
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one artifact-manifest.json for attestation, found ${#manifests[@]}."
            printf 'Manifest candidate: %s\n' "${manifests[@]}"
            exit 1
          fi
          printf 'path=%s\n' "${manifests[0]}" >> "$GITHUB_OUTPUT"

      - name: Attest artifact manifest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.manifest.outputs.path }}
