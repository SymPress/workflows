name: SymPress QA

on:
  workflow_call:
    inputs:
      php_version:
        description: PHP version used for Composer and QA tools.
        type: string
        default: '8.5'
        required: false
      php_extensions:
        description: Extensions passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      node_version:
        description: Node version used for package asset checks.
        type: string
        default: '24'
        required: false
      allow_unpinned_node_install:
        description: Allow npm install when no lockfile exists. Keep disabled for reproducible CI.
        type: boolean
        default: false
        required: false
      package_glob:
        description: Glob for Composer packages in monorepos.
        type: string
        default: packages/*
        required: false
      include_root:
        description: Include the repository root when it has composer.json.
        type: boolean
        default: true
        required: false
      composer_options:
        description: Options passed to Composer install.
        type: string
        default: --prefer-dist --no-progress --no-interaction
        required: false
      update_dependencies:
        description: Resolve current permitted dependency versions before QA; use for scheduled compatibility checks.
        type: boolean
        default: false
        required: false
      run_validate:
        description: Run composer validate.
        type: boolean
        default: true
        required: false
      run_audit:
        description: Run composer audit.
        type: boolean
        default: true
        required: false
      run_phpcs:
        description: Run PHPCS or Composer coding standards scripts.
        type: boolean
        default: true
        required: false
      run_phpstan:
        description: Run PHPStan or Composer static analysis scripts.
        type: boolean
        default: true
        required: false
      run_phpunit:
        description: Run PHPUnit or Composer test scripts.
        type: boolean
        default: true
        required: false
      run_node_build:
        description: Run package build scripts for packages with package.json.
        type: boolean
        default: false
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 30
        required: false
    secrets:
      SSH_KEY:
        description: Optional read-only SSH deploy key for private Composer repositories.
        required: false
      SSH_KNOWN_HOSTS:
        description: Required pinned known_hosts entries when SSH_KEY is provided.
        required: false
      COMPOSER_AUTH_JSON:
        description: Composer authentication JSON.
        required: false
      NPM_REGISTRY_TOKEN:
        description: npm registry token.
        required: false
      ENV_VARS:
        description: JSON object or array of {name,value} variables to export.
        required: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover Composer targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover Composer targets
        id: targets
        shell: bash
        env:
          PACKAGE_GLOB: ${{ inputs.package_glob }}
          INCLUDE_ROOT: ${{ inputs.include_root }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          targets=()
          if [ "$INCLUDE_ROOT" = "true" ] && [ -f composer.json ]; then
            targets+=(".")
          fi

          # shellcheck disable=SC2086
          for composer_file in ${PACKAGE_GLOB}/composer.json; do
            target="${composer_file%/composer.json}"
            if [ "$target" != "." ]; then
              targets+=("$target")
            fi
          done

          if [ "${#targets[@]}" -eq 0 ]; then
            echo 'targets=["__no_targets__"]' >> "$GITHUB_OUTPUT"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          targets_json="$(printf '%s\n' "${targets[@]}" | jq -R -s -c 'split("\n")[:-1]')"
          echo "targets=$targets_json" >> "$GITHUB_OUTPUT"
          echo "has_targets=true" >> "$GITHUB_OUTPUT"

  qa:
    name: QA (${{ matrix.target }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    env:
      CI: true
      ALLOW_UNPINNED_NODE_INSTALL: ${{ inputs.allow_unpinned_node_install }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report empty repository
        if: ${{ matrix.target == '__no_targets__' }}
        run: echo "No Composer targets found."

      - name: Configure Composer SSH
        env:
          COMPOSER_SSH_KEY: ${{ secrets.SSH_KEY }}
          COMPOSER_SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        if: ${{ env.COMPOSER_SSH_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$COMPOSER_SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS is required with SSH_KEY."
            exit 1
          fi
          umask 077
          printf '%s\n' "$COMPOSER_SSH_KEY" > "$RUNNER_TEMP/composer-deploy-key"
          printf '%s\n' "$COMPOSER_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/composer-known-hosts"
          printf 'GIT_SSH_COMMAND=ssh -i "%s/composer-deploy-key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="%s/composer-known-hosts"\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Export custom environment
        env:
          ENV_VARS_JSON: ${{ secrets.ENV_VARS }}
        if: ${{ matrix.target != '__no_targets__' && !inputs.update_dependencies && env.ENV_VARS_JSON != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const raw = process.env.ENV_VARS_JSON || '';
            const data = JSON.parse(raw);
            const items = Array.isArray(data)
              ? data
              : Object.entries(data).map(([name, value]) => ({ name, value }));
            const blockedNames = new Set([
              'BASH_ENV',
              'ENV',
              'GITHUB_ENV',
              'GITHUB_OUTPUT',
              'GITHUB_PATH',
              'LD_PRELOAD',
              'NODE_OPTIONS',
              'PATH',
            ]);

            for (const item of items) {
              const name = String(item.name || '');
              if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
                core.setFailed(`Invalid environment variable name: ${name}`);
                return;
              }
              if (/^(GITHUB_|ACTIONS_|RUNNER_)/.test(name) || blockedNames.has(name)) {
                core.setFailed(`Refusing to override reserved environment variable: ${name}`);
                return;
              }
              core.setSecret(String(item.value));
              core.exportVariable(name, String(item.value));
            }

      - name: Set up PHP
        if: ${{ matrix.target != '__no_targets__' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2, cs2pr
          coverage: none

      - name: Detect package manager
        id: package-manager
        if: ${{ matrix.target != '__no_targets__' && inputs.run_node_build }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          path_for() {
            if [ "$TARGET" = "." ]; then
              printf '%s' "$1"
            else
              printf '%s/%s' "${TARGET%/}" "$1"
            fi
          }

          if [ -f "$(path_for pnpm-lock.yaml)" ]; then
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for yarn.lock)" ]; then
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for yarn.lock)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for package-lock.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for package-lock.json)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for npm-shrinkwrap.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for npm-shrinkwrap.json)" >> "$GITHUB_OUTPUT"
          else
            echo "cache=" >> "$GITHUB_OUTPUT"
            echo "lockfile=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: ${{ matrix.target != '__no_targets__' && inputs.run_node_build && steps.package-manager.outputs.cache == '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Set up Node with cache
        if: ${{ matrix.target != '__no_targets__' && inputs.run_node_build && steps.package-manager.outputs.cache != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ steps.package-manager.outputs.cache }}
          cache-dependency-path: ${{ steps.package-manager.outputs.lockfile }}

      - name: Fetch current Canary dependencies
        if: ${{ matrix.target != '__no_targets__' && inputs.update_dependencies }}
        working-directory: ${{ matrix.target }}
        shell: bash
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
          COMPOSER_OPTIONS: ${{ inputs.composer_options }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/composer-deploy-key" "$RUNNER_TEMP/composer-known-hosts"' EXIT
          # shellcheck disable=SC2086
          composer update $COMPOSER_OPTIONS --no-scripts --no-plugins
          # shellcheck disable=SC2086
          composer install $COMPOSER_OPTIONS --no-scripts --no-plugins

      - name: Run QA
        if: ${{ matrix.target != '__no_targets__' }}
        working-directory: ${{ matrix.target }}
        shell: bash
        env:
          COMPOSER_AUTH: ${{ !inputs.update_dependencies && secrets.COMPOSER_AUTH_JSON || '' }}
          NODE_AUTH_TOKEN: ${{ !inputs.update_dependencies && secrets.NPM_REGISTRY_TOKEN || '' }}
          COMPOSER_OPTIONS: ${{ inputs.composer_options }}
          RUN_VALIDATE: ${{ inputs.run_validate }}
          RUN_AUDIT: ${{ inputs.run_audit }}
          RUN_PHPCS: ${{ inputs.run_phpcs }}
          RUN_PHPSTAN: ${{ inputs.run_phpstan }}
          RUN_PHPUNIT: ${{ inputs.run_phpunit }}
          RUN_NODE_BUILD: ${{ inputs.run_node_build }}
          UPDATE_DEPENDENCIES: ${{ inputs.update_dependencies }}
        run: |
          set -euo pipefail
          export CI=true
          if [ "${UPDATE_DEPENDENCIES:-false}" = "true" ]; then
            unset COMPOSER_AUTH NODE_AUTH_TOKEN SSH_AUTH_SOCK SSH_AGENT_PID GIT_SSH_COMMAND
            test ! -e "$RUNNER_TEMP/composer-deploy-key"
            test ! -e "$RUNNER_TEMP/composer-known-hosts"
            # Register sniff packages explicitly: the update intentionally skips Composer plugins.
            vendor_dir="$(composer config vendor-dir)"
            bin_dir="$(composer config bin-dir)"
            if [ -x "${bin_dir%/}/phpcs" ]; then
              # shellcheck disable=SC2016 -- Dollar expressions belong to PHP, not the shell.
              standard_paths="$(php -r '
                require $argv[1] . "/autoload.php";
                $paths = [];
                foreach (Composer\InstalledVersions::getInstalledPackagesByType("phpcodesniffer-standard") as $package) {
                    $path = Composer\InstalledVersions::getInstallPath($package);
                    if ($path !== null && is_dir($path)) {
                        $paths[] = $path;
                    }
                }
                echo implode(",", $paths);
              ' "$vendor_dir")"
              "${bin_dir%/}/phpcs" --config-set installed_paths "$standard_paths"
            fi
          fi

          has_script() {
            local script="$1"
            composer run-script --list | grep -Eq "^[[:space:]]+${script}[[:space:]]"
          }

          install_node_dependencies() {
            if [ -f pnpm-lock.yaml ]; then
              corepack enable
              pnpm install --frozen-lockfile
            elif [ -f yarn.lock ]; then
              corepack enable
              yarn install --immutable || yarn install --frozen-lockfile
            elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              if [ "${ALLOW_UNPINNED_NODE_INSTALL:-false}" != "true" ]; then
                echo "::error::No JavaScript lockfile found. Add pnpm-lock.yaml, yarn.lock, package-lock.json, or npm-shrinkwrap.json, or set allow_unpinned_node_install=true for trusted callers."
                exit 1
              fi
              npm install
            fi
          }

          run_node_build() {
            if [ ! -f package.json ]; then
              return 0
            fi

            if ! node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
              echo "No build script in $(pwd)/package.json."
              return 0
            fi

            install_node_dependencies
            if [ -f pnpm-lock.yaml ]; then
              pnpm build
            elif [ -f yarn.lock ]; then
              yarn build
            else
              npm run build
            fi
          }

          run_phpcs() {
            if has_script "cs:audit"; then
              composer cs:audit
              return
            fi

            if has_script "phpcs"; then
              composer phpcs
              return
            fi

            if has_script "cs"; then
              composer cs
              return
            fi

            local bin_dir phpcs_bin
            bin_dir="$(composer config bin-dir)"
            phpcs_bin="${bin_dir%/}/phpcs"

            if [ ! -x "$phpcs_bin" ]; then
              echo "::error::Required PHPCS executable is missing."
              return 1
            fi

            if [ -f phpcs.xml ] || [ -f phpcs.xml.dist ]; then
              "$phpcs_bin" --standard="$(test -f phpcs.xml && echo phpcs.xml || echo phpcs.xml.dist)"
            else
              echo "::error::Required PHPCS configuration is missing."
              return 1
            fi
          }

          run_static_analysis() {
            if has_script "cs:analyze"; then
              composer cs:analyze
              return
            fi

            if has_script "phpstan"; then
              composer phpstan
              return
            fi

            if has_script "stan"; then
              composer stan
              return
            fi

            if has_script "static-analysis"; then
              composer static-analysis
              return
            fi

            local bin_dir ran
            bin_dir="$(composer config bin-dir)"
            ran=false

            if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ] || [ -f phpstan.dist.neon ]; then
              "${bin_dir%/}/phpstan" analyse --no-progress --memory-limit=1G
              ran=true
            fi

            if [ "$ran" = false ]; then
              echo "::error::Required PHPStan configuration is missing."
              return 1
            fi
          }

          run_phpunit() {
            if has_script "test:unit"; then
              composer test:unit
              return
            fi

            if has_script "test"; then
              composer test
              return
            fi

            if has_script "tests"; then
              composer tests
              return
            fi

            if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
              local bin_dir
              bin_dir="$(composer config bin-dir)"
              "${bin_dir%/}/phpunit" --no-coverage
            else
              echo "::error::Required PHPUnit configuration is missing."
              return 1
            fi
          }

          if [ "$RUN_VALIDATE" = "true" ]; then
            composer validate --strict --no-check-publish
          fi

          if [ "${UPDATE_DEPENDENCIES:-false}" != "true" ]; then
            # shellcheck disable=SC2086
            composer install $COMPOSER_OPTIONS
          fi

          if [ "$RUN_AUDIT" = "true" ]; then
            if [ -f composer.lock ]; then
              composer audit --locked --no-interaction
            else
              composer audit --no-interaction
            fi
          fi

          if [ "$RUN_PHPCS" = "true" ] && [ "$RUN_PHPSTAN" = "true" ] && [ "$RUN_PHPUNIT" = "true" ] && has_script "qa"; then
            composer qa
          else
            if [ "$RUN_PHPCS" = "true" ]; then
              run_phpcs
            fi
            if [ "$RUN_PHPSTAN" = "true" ]; then
              run_static_analysis
            fi
            if [ "$RUN_PHPUNIT" = "true" ]; then
              run_phpunit
            fi
          fi

          if [ "$RUN_NODE_BUILD" = "true" ]; then
            run_node_build
          fi

      - name: Remove Composer SSH credentials
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/composer-deploy-key" "$RUNNER_TEMP/composer-known-hosts"
