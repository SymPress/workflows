name: SymPress QA

on:
  workflow_call:
    inputs:
      php_version:
        description: PHP version used for Composer and QA tools.
        type: string
        default: '8.5'
        required: false
      php_extensions:
        description: Extensions passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      node_version:
        description: Node version used for package asset checks.
        type: string
        default: '24'
        required: false
      package_glob:
        description: Glob for Composer packages in monorepos.
        type: string
        default: packages/*
        required: false
      include_root:
        description: Include the repository root when it has composer.json.
        type: boolean
        default: true
        required: false
      composer_options:
        description: Options passed to Composer install.
        type: string
        default: --prefer-dist --no-progress --no-interaction
        required: false
      run_validate:
        description: Run composer validate.
        type: boolean
        default: true
        required: false
      run_audit:
        description: Run composer audit.
        type: boolean
        default: true
        required: false
      run_phpcs:
        description: Run PHPCS or Composer coding standards scripts.
        type: boolean
        default: true
        required: false
      run_phpstan:
        description: Run PHPStan or Composer static analysis scripts.
        type: boolean
        default: true
        required: false
      run_phpunit:
        description: Run PHPUnit or Composer test scripts.
        type: boolean
        default: true
        required: false
      run_node_build:
        description: Run package build scripts for packages with package.json.
        type: boolean
        default: false
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 30
        required: false
    secrets:
      COMPOSER_AUTH_JSON:
        description: Composer authentication JSON.
        required: false
      NPM_REGISTRY_TOKEN:
        description: npm registry token.
        required: false
      ENV_VARS:
        description: JSON object or array of {name,value} variables to export.
        required: false

permissions:
  contents: read

jobs:
  sympress-qa:
    name: SymPress QA
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export custom environment
        env:
          ENV_VARS_JSON: ${{ secrets.ENV_VARS }}
        if: ${{ env.ENV_VARS_JSON != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const raw = process.env.ENV_VARS_JSON || '';
            const data = JSON.parse(raw);
            const items = Array.isArray(data)
              ? data
              : Object.entries(data).map(([name, value]) => ({ name, value }));

            for (const item of items) {
              core.setSecret(String(item.value));
              core.exportVariable(item.name, String(item.value));
            }

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2, cs2pr
          coverage: none

      - name: Set up Node
        if: ${{ inputs.run_node_build }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Run QA
        shell: bash
        env:
          PACKAGE_GLOB: ${{ inputs.package_glob }}
          INCLUDE_ROOT: ${{ inputs.include_root }}
          COMPOSER_OPTIONS: ${{ inputs.composer_options }}
          RUN_VALIDATE: ${{ inputs.run_validate }}
          RUN_AUDIT: ${{ inputs.run_audit }}
          RUN_PHPCS: ${{ inputs.run_phpcs }}
          RUN_PHPSTAN: ${{ inputs.run_phpstan }}
          RUN_PHPUNIT: ${{ inputs.run_phpunit }}
          RUN_NODE_BUILD: ${{ inputs.run_node_build }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          targets=()
          if [ "$INCLUDE_ROOT" = "true" ] && [ -f composer.json ]; then
            targets+=(".")
          fi

          for composer_file in ${PACKAGE_GLOB}/composer.json; do
            target="${composer_file%/composer.json}"
            if [ "$target" != "." ]; then
              targets+=("$target")
            fi
          done

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No Composer targets found."
            exit 0
          fi

          has_script() {
            local script="$1"
            composer run-script --list | grep -Eq "^[[:space:]]+${script}[[:space:]]"
          }

          install_node_dependencies() {
            if [ -f pnpm-lock.yaml ]; then
              corepack enable
              pnpm install --frozen-lockfile
            elif [ -f yarn.lock ]; then
              corepack enable
              yarn install --immutable || yarn install --frozen-lockfile
            elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              npm install
            fi
          }

          run_node_build() {
            if [ ! -f package.json ]; then
              return 0
            fi

            if ! node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
              echo "No build script in $(pwd)/package.json."
              return 0
            fi

            install_node_dependencies
            if [ -f pnpm-lock.yaml ]; then
              pnpm build
            elif [ -f yarn.lock ]; then
              yarn build
            else
              npm run build
            fi
          }

          run_phpcs() {
            if has_script "cs:audit"; then
              composer cs:audit
              return
            fi

            if has_script "cs"; then
              composer cs
              return
            fi

            if [ -f phpcs.xml ] || [ -f phpcs.xml.dist ]; then
              local bin_dir
              bin_dir="$(composer config bin-dir)"
              "${bin_dir%/}/phpcs" --standard="$(test -f phpcs.xml && echo phpcs.xml || echo phpcs.xml.dist)"
            else
              echo "No PHPCS configuration found."
            fi
          }

          run_static_analysis() {
            if has_script "cs:analyze"; then
              composer cs:analyze
              return
            fi

            if has_script "static-analysis"; then
              composer static-analysis
              return
            fi

            local bin_dir ran
            bin_dir="$(composer config bin-dir)"
            ran=false

            if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ] || [ -f phpstan.dist.neon ]; then
              "${bin_dir%/}/phpstan" analyse --no-progress --memory-limit=1G
              ran=true
            fi

            if [ "$ran" = false ]; then
              echo "No PHPStan configuration found."
            fi
          }

          run_phpunit() {
            if has_script "test:unit"; then
              composer test:unit
              return
            fi

            if has_script "test"; then
              composer test
              return
            fi

            if has_script "tests"; then
              composer tests
              return
            fi

            if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
              local bin_dir
              bin_dir="$(composer config bin-dir)"
              "${bin_dir%/}/phpunit" --no-coverage
            else
              echo "No PHPUnit configuration found."
            fi
          }

          for target in "${targets[@]}"; do
            echo "::group::${target}"
            (
              cd "$target"

              if [ "$RUN_VALIDATE" = "true" ]; then
                composer validate --strict --no-check-publish
              fi

              # shellcheck disable=SC2086
              composer install $COMPOSER_OPTIONS

              if [ "$RUN_AUDIT" = "true" ]; then
                if [ -f composer.lock ]; then
                  composer audit --locked --no-interaction
                else
                  composer audit --no-interaction
                fi
              fi

              if [ "$RUN_PHPCS" = "true" ]; then
                run_phpcs
              fi

              if [ "$RUN_PHPSTAN" = "true" ]; then
                run_static_analysis
              fi

              if [ "$RUN_PHPUNIT" = "true" ]; then
                run_phpunit
              fi

              if [ "$RUN_NODE_BUILD" = "true" ]; then
                run_node_build
              fi
            )
            echo "::endgroup::"
          done
