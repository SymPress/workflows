name: PHP static analysis

on:
  workflow_call:
    inputs:
      php_version:
        description: PHP version used for static analysis.
        type: string
        default: '8.5'
        required: false
      php_extensions:
        description: Extensions passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      working_directory:
        description: Directory that contains composer.json.
        type: string
        default: .
        required: false
      composer_options:
        description: Options passed to Composer install.
        type: string
        default: --prefer-dist --no-progress --no-interaction
        required: false
      dependency_versions:
        description: Dependency resolution passed to Composer install. Use locked, highest, or lowest.
        type: string
        default: locked
        required: false
      command:
        description: Explicit command to run instead of auto-detecting PHPStan.
        type: string
        default: ''
        required: false
      allow_custom_command:
        description: Allow command execution. Keep disabled for untrusted callers.
        type: boolean
        default: false
        required: false
      phpstan_args:
        description: Arguments passed to PHPStan.
        type: string
        default: analyse --no-progress --memory-limit=1G
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 10
        required: false
    secrets:
      COMPOSER_AUTH_JSON:
        description: Composer authentication JSON.
        required: false
      ENV_VARS:
        description: JSON object or array of {name,value} variables to export.
        required: false

permissions:
  contents: read

jobs:
  php-static-analysis:
    name: PHP static analysis
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Export custom environment
        env:
          ENV_VARS_JSON: ${{ secrets.ENV_VARS }}
        if: ${{ env.ENV_VARS_JSON != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const raw = process.env.ENV_VARS_JSON || '';
            const data = JSON.parse(raw);
            const items = Array.isArray(data)
              ? data
              : Object.entries(data).map(([name, value]) => ({ name, value }));

            for (const item of items) {
              core.setSecret(String(item.value));
              core.exportVariable(item.name, String(item.value));
            }

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
        with:
          working-directory: ${{ inputs.working_directory }}
          composer-options: ${{ inputs.composer_options }}
          dependency-versions: ${{ inputs.dependency_versions }}

      - name: Run static analysis
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
          ALLOW_CUSTOM_COMMAND: ${{ inputs.allow_custom_command }}
          PHPSTAN_ARGS: ${{ inputs.phpstan_args }}
        run: |
          set -euo pipefail

          if [ -n "$COMMAND" ]; then
            if [ "$ALLOW_CUSTOM_COMMAND" != "true" ]; then
              echo "::error::command is disabled by default. Set allow_custom_command=true only for trusted workflow calls."
              exit 1
            fi
            bash -lc "$COMMAND"
            exit 0
          fi

          if composer run-script --list | grep -Eq '^[[:space:]]+cs:analyze[[:space:]]'; then
            composer cs:analyze
            exit 0
          fi

          if composer run-script --list | grep -Eq '^[[:space:]]+phpstan[[:space:]]'; then
            composer phpstan
            exit 0
          fi

          if composer run-script --list | grep -Eq '^[[:space:]]+stan[[:space:]]'; then
            composer stan
            exit 0
          fi

          if composer run-script --list | grep -Eq '^[[:space:]]+static-analysis[[:space:]]'; then
            composer static-analysis
            exit 0
          fi

          bin_dir="$(composer config bin-dir)"
          ran=false

          if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ] || [ -f phpstan.dist.neon ]; then
            # shellcheck disable=SC2086
            "${bin_dir%/}/phpstan" $PHPSTAN_ARGS
            ran=true
          fi

          if [ "$ran" = false ]; then
            echo "No PHPStan configuration found."
          fi
