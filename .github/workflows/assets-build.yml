name: Build assets

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory that contains composer.json and/or package.json.
        type: string
        default: .
        required: false
      php_version:
        description: PHP version used for Composer asset builds.
        type: string
        default: '8.5'
        required: false
      php_extensions:
        description: Extensions passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      node_version:
        description: Node version used for npm/yarn/pnpm builds.
        type: string
        default: '24'
        required: false
      node_options:
        description: NODE_OPTIONS value.
        type: string
        default: ''
        required: false
      npm_registry_domain:
        description: npm registry URL.
        type: string
        default: https://npm.pkg.github.com/
        required: false
      allow_unpinned_node_install:
        description: Allow npm install when no lockfile exists. Keep disabled for reproducible CI.
        type: boolean
        default: false
        required: false
      composer_install:
        description: Install Composer dependencies before building.
        type: boolean
        default: true
        required: false
      composer_options:
        description: Options passed to Composer install.
        type: string
        default: --prefer-dist --no-progress --no-interaction
        required: false
      run_asset_compiler:
        description: Run Composer compile-assets if available.
        type: boolean
        default: true
        required: false
      asset_compiler_args:
        description: Arguments passed to composer compile-assets.
        type: string
        default: -v --env=root
        required: false
      run_node_build:
        description: Run the package build script if package.json exists.
        type: boolean
        default: true
        required: false
      build_script:
        description: npm/yarn/pnpm script to run.
        type: string
        default: build
        required: false
      artifact_name:
        description: Optional artifact name to upload after building.
        type: string
        default: ''
        required: false
      artifact_path:
        description: Optional artifact path to upload after building.
        type: string
        default: ''
        required: false
      artifact_include_hidden_files:
        description: Include hidden files in artifact uploads.
        type: boolean
        default: false
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 15
        required: false
    secrets:
      COMPOSER_AUTH_JSON:
        description: Composer authentication JSON.
        required: false
      NPM_REGISTRY_TOKEN:
        description: npm registry token.
        required: false
      ENV_VARS:
        description: JSON object or array of {name,value} variables to export.
        required: false

permissions:
  contents: read

jobs:
  assets-build:
    name: Build assets
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      NODE_OPTIONS: ${{ inputs.node_options }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
      ALLOW_UNPINNED_NODE_INSTALL: ${{ inputs.allow_unpinned_node_install }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Detect project files
        id: detect
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          test -f "$WD/composer.json" && echo "has_composer=true" >> "$GITHUB_OUTPUT" || echo "has_composer=false" >> "$GITHUB_OUTPUT"
          test -f "$WD/package.json" && echo "has_package_json=true" >> "$GITHUB_OUTPUT" || echo "has_package_json=false" >> "$GITHUB_OUTPUT"

      - name: Detect package manager
        id: package-manager
        if: ${{ steps.detect.outputs.has_package_json == 'true' && inputs.run_node_build }}
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          path_for() {
            if [ "$WD" = "." ]; then
              printf '%s' "$1"
            else
              printf '%s/%s' "${WD%/}" "$1"
            fi
          }

          if [ -f "$(path_for pnpm-lock.yaml)" ]; then
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for yarn.lock)" ]; then
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for yarn.lock)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for package-lock.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for package-lock.json)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for npm-shrinkwrap.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for npm-shrinkwrap.json)" >> "$GITHUB_OUTPUT"
          else
            echo "cache=" >> "$GITHUB_OUTPUT"
            echo "lockfile=" >> "$GITHUB_OUTPUT"
          fi

      - name: Export custom environment
        env:
          ENV_VARS_JSON: ${{ secrets.ENV_VARS }}
        if: ${{ env.ENV_VARS_JSON != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const raw = process.env.ENV_VARS_JSON || '';
            const data = JSON.parse(raw);
            const items = Array.isArray(data)
              ? data
              : Object.entries(data).map(([name, value]) => ({ name, value }));
            const blockedNames = new Set([
              'BASH_ENV',
              'ENV',
              'GITHUB_ENV',
              'GITHUB_OUTPUT',
              'GITHUB_PATH',
              'LD_PRELOAD',
              'NODE_OPTIONS',
              'PATH',
            ]);

            for (const item of items) {
              const name = String(item.name || '');
              if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
                core.setFailed(`Invalid environment variable name: ${name}`);
                return;
              }
              if (/^(GITHUB_|ACTIONS_|RUNNER_)/.test(name) || blockedNames.has(name)) {
                core.setFailed(`Refusing to override reserved environment variable: ${name}`);
                return;
              }
              core.setSecret(String(item.value));
              core.exportVariable(name, String(item.value));
            }

      - name: Set up PHP
        if: ${{ steps.detect.outputs.has_composer == 'true' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        if: ${{ steps.detect.outputs.has_composer == 'true' && inputs.composer_install }}
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
        with:
          working-directory: ${{ inputs.working_directory }}
          composer-options: ${{ inputs.composer_options }}

      - name: Set up Node
        if: ${{ steps.detect.outputs.has_package_json == 'true' && inputs.run_node_build && steps.package-manager.outputs.cache == '' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}

      - name: Set up Node with cache
        if: ${{ steps.detect.outputs.has_package_json == 'true' && inputs.run_node_build && steps.package-manager.outputs.cache != '' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}
          cache: ${{ steps.package-manager.outputs.cache }}
          cache-dependency-path: ${{ steps.package-manager.outputs.lockfile }}

      - name: Install Node dependencies
        if: ${{ steps.detect.outputs.has_package_json == 'true' && inputs.run_node_build }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable || yarn install --frozen-lockfile
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            if [ "${ALLOW_UNPINNED_NODE_INSTALL:-false}" != "true" ]; then
              echo "::error::No JavaScript lockfile found. Add pnpm-lock.yaml, yarn.lock, package-lock.json, or npm-shrinkwrap.json, or set allow_unpinned_node_install=true for trusted callers."
              exit 1
            fi
            npm install
          fi

      - name: Run Composer asset compiler
        if: ${{ steps.detect.outputs.has_composer == 'true' && inputs.run_asset_compiler }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          ASSET_COMPILER_ARGS: ${{ inputs.asset_compiler_args }}
        run: |
          set -euo pipefail
          if composer run-script --list | grep -Eq '^[[:space:]]+compile-assets[[:space:]]'; then
            # shellcheck disable=SC2086
            composer compile-assets $ASSET_COMPILER_ARGS
          else
            echo "Composer compile-assets script not found."
          fi

      - name: Run Node build
        if: ${{ steps.detect.outputs.has_package_json == 'true' && inputs.run_node_build }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          BUILD_SCRIPT: ${{ inputs.build_script }}
        run: |
          set -euo pipefail
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts[process.env.BUILD_SCRIPT] ? 0 : 1)"; then
            echo "No $BUILD_SCRIPT script found."
            exit 0
          fi

          if [ -f pnpm-lock.yaml ]; then
            pnpm "$BUILD_SCRIPT"
          elif [ -f yarn.lock ]; then
            yarn "$BUILD_SCRIPT"
          else
            npm run "$BUILD_SCRIPT"
          fi

      - name: Upload build artifact
        if: ${{ inputs.artifact_name != '' && inputs.artifact_path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ format('{0}/{1}', inputs.working_directory, inputs.artifact_path) }}
          if-no-files-found: error
          include-hidden-files: ${{ inputs.artifact_include_hidden_files }}
