name: Text quality

on:
  workflow_call:
    inputs:
      run_typos:
        description: Run typos for fast typo detection.
        type: boolean
        default: true
        required: false
      typos_files:
        description: Files or patterns passed to typos.
        type: string
        default: .
        required: false
      typos_config:
        description: Optional typos configuration file.
        type: string
        default: ''
        required: false
      run_cspell:
        description: Run CSpell for project vocabulary checks.
        type: boolean
        default: true
        required: false
      cspell_files:
        description: Newline-separated glob patterns passed to CSpell.
        type: string
        default: '**/*.{php,js,jsx,ts,tsx,md,txt,json,yml,yaml}'
        required: false
      cspell_config:
        description: Optional CSpell configuration file.
        type: string
        default: ''
        required: false
      cspell_incremental_files_only:
        description: Check only changed files on pull_request or push events.
        type: boolean
        default: true
        required: false
      run_grammar:
        description: Run LanguageTool grammar review on pull requests.
        type: boolean
        default: false
        required: false
      grammar_patterns:
        description: Space-separated markdown or text glob patterns for LanguageTool.
        type: string
        default: '**/*.md **/*.txt'
        required: false
      grammar_language:
        description: LanguageTool language code.
        type: string
        default: en-US
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 10
        required: false

permissions:
  contents: read

jobs:
  text-quality:
    name: Text quality
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run typos
        if: ${{ inputs.run_typos }}
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
        with:
          files: ${{ inputs.typos_files }}
          config: ${{ inputs.typos_config }}

      - name: Run CSpell
        if: ${{ inputs.run_cspell }}
        uses: streetsidesoftware/cspell-action@de2a73e963e7443969755b648a1008f77033c5b2 # v8.4.0
        with:
          files: ${{ inputs.cspell_files }}
          config: ${{ inputs.cspell_config }}
          incremental_files_only: ${{ inputs.cspell_incremental_files_only }}
          inline: warning
          strict: true

  grammar-review:
    name: Grammar review
    if: ${{ inputs.run_grammar && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run grammar review
        uses: reviewdog/action-languagetool@afd06e9b0f782c9562c92efffb66a49c09b2b4f4 # v1
        with:
          github_token: ${{ github.token }}
          reporter: github-pr-check
          level: warning
          patterns: ${{ inputs.grammar_patterns }}
          language: ${{ inputs.grammar_language }}
