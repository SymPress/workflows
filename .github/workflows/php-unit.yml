name: PHP unit tests

on:
  workflow_call:
    inputs:
      php_version:
        description: PHP version used for PHPUnit.
        type: string
        default: '8.5'
        required: false
      php_extensions:
        description: Extensions passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      working_directory:
        description: Directory that contains composer.json.
        type: string
        default: .
        required: false
      composer_options:
        description: Options passed to Composer install.
        type: string
        default: --prefer-dist --no-progress --no-interaction
        required: false
      coverage:
        description: Coverage driver passed to setup-php.
        type: string
        default: none
        required: false
      command:
        description: Explicit command to run instead of auto-detecting PHPUnit.
        type: string
        default: ''
        required: false
      allow_custom_command:
        description: Allow command execution. Keep disabled for untrusted callers.
        type: boolean
        default: false
        required: false
      phpunit_args:
        description: Arguments passed to PHPUnit when no Composer script is found.
        type: string
        default: --no-coverage
        required: false
      junit_artifact:
        description: Upload JUnit output if junit.xml exists.
        type: boolean
        default: true
        required: false
      codecov_upload:
        description: Upload coverage to Codecov when CODECOV_TOKEN is provided.
        type: boolean
        default: true
        required: false
      codecov_files:
        description: Coverage file paths passed to Codecov.
        type: string
        default: coverage.xml
        required: false
      codecov_flags:
        description: Codecov flags.
        type: string
        default: unittests
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 10
        required: false
    secrets:
      COMPOSER_AUTH_JSON:
        description: Composer authentication JSON.
        required: false
      ENV_VARS:
        description: JSON object or array of {name,value} variables to export.
        required: false
      CODECOV_TOKEN:
        description: Token used to upload coverage reports to Codecov.
        required: false

permissions:
  contents: read

jobs:
  php-unit:
    name: PHP unit tests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Export custom environment
        env:
          ENV_VARS_JSON: ${{ secrets.ENV_VARS }}
        if: ${{ env.ENV_VARS_JSON != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const raw = process.env.ENV_VARS_JSON || '';
            const data = JSON.parse(raw);
            const items = Array.isArray(data)
              ? data
              : Object.entries(data).map(([name, value]) => ({ name, value }));
            const blockedNames = new Set([
              'BASH_ENV',
              'ENV',
              'GITHUB_ENV',
              'GITHUB_OUTPUT',
              'GITHUB_PATH',
              'LD_PRELOAD',
              'NODE_OPTIONS',
              'PATH',
            ]);

            for (const item of items) {
              const name = String(item.name || '');
              if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
                core.setFailed(`Invalid environment variable name: ${name}`);
                return;
              }
              if (/^(GITHUB_|ACTIONS_|RUNNER_)/.test(name) || blockedNames.has(name)) {
                core.setFailed(`Refusing to override reserved environment variable: ${name}`);
                return;
              }
              core.setSecret(String(item.value));
              core.exportVariable(name, String(item.value));
            }

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2
          coverage: ${{ inputs.coverage }}

      - name: Add PHPUnit problem matcher
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
        with:
          working-directory: ${{ inputs.working_directory }}
          composer-options: ${{ inputs.composer_options }}

      - name: Run PHPUnit
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
          ALLOW_CUSTOM_COMMAND: ${{ inputs.allow_custom_command }}
          PHPUNIT_ARGS: ${{ inputs.phpunit_args }}
        run: |
          set -euo pipefail

          if [ -n "$COMMAND" ]; then
            if [ "$ALLOW_CUSTOM_COMMAND" != "true" ]; then
              echo "::error::command is disabled by default. Set allow_custom_command=true only for trusted workflow calls."
              exit 1
            fi
            bash -lc "$COMMAND"
            exit 0
          fi

          if composer run-script --list | grep -Eq '^[[:space:]]+test:unit[[:space:]]'; then
            composer test:unit
            exit 0
          fi

          if composer run-script --list | grep -Eq '^[[:space:]]+test[[:space:]]'; then
            composer test
            exit 0
          fi

          if composer run-script --list | grep -Eq '^[[:space:]]+tests[[:space:]]'; then
            composer tests
            exit 0
          fi

          bin_dir="$(composer config bin-dir)"
          # shellcheck disable=SC2086
          "${bin_dir%/}/phpunit" $PHPUNIT_ARGS

      - name: Upload JUnit report
        if: ${{ always() && inputs.junit_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phpunit-junit
          path: ${{ format('{0}/junit.xml', inputs.working_directory) }}
          if-no-files-found: ignore

      - name: Detect Codecov coverage files
        id: codecov-files
        if: ${{ always() && inputs.codecov_upload && env.CODECOV_TOKEN != '' }}
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          CODECOV_FILES: ${{ inputs.codecov_files }}
        run: |
          set -euo pipefail
          wd="${WORKING_DIRECTORY%/}"
          found=()

          IFS=',' read -ra candidates <<< "$CODECOV_FILES"
          for raw_path in "${candidates[@]}"; do
            path="$(printf '%s' "$raw_path" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$path" ] && continue

            if [[ "$path" = /* || "$wd" = "." ]]; then
              candidate="$path"
            else
              candidate="$wd/$path"
            fi

            if compgen -G "$candidate" >/dev/null; then
              found+=("$candidate")
            fi
          done

          if [ "${#found[@]}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          (IFS=,; echo "files=${found[*]}") >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        if: ${{ always() && steps.codecov-files.outputs.found == 'true' }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ${{ steps.codecov-files.outputs.files }}
          flags: ${{ inputs.codecov_flags }}
          fail_ci_if_error: true
