name: Deploy with Deployer

on:
  workflow_call:
    inputs:
      environment:
        description: Deployer environment/stage.
        type: string
        required: true
      verbosity:
        description: Deployer verbosity without leading dash.
        type: string
        default: v
        required: false
      working_directory:
        description: Repository directory to install before deployment.
        type: string
        default: .
        required: false
      deployment_directory:
        description: Directory containing Deployer composer.json and deploy config.
        type: string
        default: deployment
        required: false
      deploy_command:
        description: Command executed inside deployment_directory.
        type: string
        default: ./vendor/bin/dep deploy
        required: false
      allow_custom_deploy_command:
        description: Allow deploy_command values other than the default.
        type: boolean
        default: false
        required: false
      allow_ssh_keyscan:
        description: Allow ssh-keyscan fallback when SSH_KNOWN_HOSTS is not provided.
        type: boolean
        default: false
        required: false
      php_version:
        description: PHP version used for Composer and Deployer.
        type: string
        default: '8.5'
        required: false
      php_extensions:
        description: Extensions passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      php_tools:
        description: Additional tools passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      node_version:
        description: Node version used when package.json is present.
        type: string
        default: '24'
        required: false
      npm_registry_domain:
        description: npm registry URL.
        type: string
        default: https://npm.pkg.github.com/
        required: false
      allow_unpinned_node_install:
        description: Allow npm install when no lockfile exists. Keep disabled for reproducible CI.
        type: boolean
        default: false
        required: false
      build_script:
        description: Optional npm/yarn/pnpm build script before deployment.
        type: string
        default: build
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 30
        required: false
    secrets:
      COMPOSER_AUTH_JSON:
        description: Composer authentication JSON.
        required: false
      INSTALL_SSH_KEY:
        description: Separate read-only SSH key for fetching private Composer dependencies.
        required: false
      INSTALL_SSH_KNOWN_HOSTS:
        description: Verified host keys for private dependency fetches.
        required: false
      GITHUB_USER_SSH_KEY:
        description: SSH key used only for deployment targets.
        required: true
      DEPLOY_HOSTNAME:
        description: Host added to known_hosts before deployment.
        required: false
      DEPLOY_PORT:
        description: SSH port for known_hosts.
        required: false
      SSH_KNOWN_HOSTS:
        description: Trusted known_hosts contents for deployment targets.
        required: false
      DEPLOY_USER:
        description: Deployer user exposed as DEPLOY_USER.
        required: false
      WIREGUARD_CONFIGURATION:
        description: Optional wg-quick configuration.
        required: false
      NPM_REGISTRY_TOKEN:
        description: npm registry token.
        required: false
    outputs:
      deploy_exit_code:
        description: Deployer process exit code.
        value: ${{ jobs.deploy.outputs.deploy_exit_code }}
      deploy_reason:
        description: Human-readable deployment result.
        value: ${{ jobs.deploy.outputs.deploy_reason }}
      deploy_warnings:
        description: Warning lines parsed from Deployer output.
        value: ${{ jobs.deploy.outputs.deploy_warnings }}
      deploy_log_excerpt:
        description: Last lines from Deployer output.
        value: ${{ jobs.deploy.outputs.deploy_log_excerpt }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      deploy_exit_code: ${{ steps.run-deployer.outputs.exit_code }}
      deploy_reason: ${{ steps.run-deployer.outputs.reason }}
      deploy_warnings: ${{ steps.run-deployer.outputs.warnings }}
      deploy_log_excerpt: ${{ steps.run-deployer.outputs.log_excerpt }}
    env:
      COMPOSER_NO_DEV: 1
      ALLOW_UNPINNED_NODE_INSTALL: ${{ inputs.allow_unpinned_node_install }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2, ${{ inputs.php_tools }}
          coverage: none

      - name: Validate Composer metadata
        working-directory: ${{ inputs.working_directory }}
        run: |
          test -f composer.lock
          composer validate --strict --no-check-publish

      - name: Install project dependencies
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
          INSTALL_SSH_KEY: ${{ secrets.INSTALL_SSH_KEY }}
          INSTALL_SSH_KNOWN_HOSTS: ${{ secrets.INSTALL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          if [ -n "$INSTALL_SSH_KEY" ]; then
            test -n "$INSTALL_SSH_KNOWN_HOSTS" || { echo "::error::Verified install host keys required."; exit 1; }
            printf '%s\n' "$INSTALL_SSH_KEY" > "$auth_dir/key"
            printf '%s\n' "$INSTALL_SSH_KNOWN_HOSTS" > "$auth_dir/known_hosts"
            while IFS= read -r host_key || [ -n "$host_key" ]; do
              [[ "$host_key" =~ ^[[:space:]]*(#|$) ]] && continue
              printf '%s\n' "$host_key" | ssh-keygen -l -f /dev/stdin >/dev/null
            done < "$auth_dir/known_hosts"
            ssh-keygen -l -f "$auth_dir/known_hosts" >/dev/null
            export GIT_SSH_COMMAND="ssh -i $auth_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$auth_dir/known_hosts"
          fi
          composer install --prefer-dist --no-dev --optimize-autoloader --no-progress --no-interaction --no-scripts --no-plugins

      - name: Detect package.json
        id: node
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          test -f "$WD/package.json" && echo "enabled=true" >> "$GITHUB_OUTPUT" || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Detect package manager
        id: package-manager
        if: ${{ steps.node.outputs.enabled == 'true' }}
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          path_for() {
            if [ "$WD" = "." ]; then
              printf '%s' "$1"
            else
              printf '%s/%s' "${WD%/}" "$1"
            fi
          }

          if [ -f "$(path_for pnpm-lock.yaml)" ]; then
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for yarn.lock)" ]; then
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for yarn.lock)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for package-lock.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for package-lock.json)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for npm-shrinkwrap.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for npm-shrinkwrap.json)" >> "$GITHUB_OUTPUT"
          else
            echo "cache=" >> "$GITHUB_OUTPUT"
            echo "lockfile=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: ${{ steps.node.outputs.enabled == 'true' && steps.package-manager.outputs.cache == '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}

      - name: Set up Node with cache
        if: ${{ steps.node.outputs.enabled == 'true' && steps.package-manager.outputs.cache != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}
          cache: ${{ steps.package-manager.outputs.cache }}
          cache-dependency-path: ${{ steps.package-manager.outputs.lockfile }}

      - name: Install Node dependencies
        if: ${{ steps.node.outputs.enabled == 'true' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
          REGISTRY_URL: ${{ inputs.npm_registry_domain }}
        run: |
          set -euo pipefail
          umask 077
          auth_file="$(mktemp)"
          trap 'rm -f "$auth_file"' EXIT
          export NPM_CONFIG_USERCONFIG="$auth_file"
          # Retain the registry token placeholder for npm.
          # shellcheck disable=SC2016
          node -e 'const u=new URL(process.env.REGISTRY_URL); if(u.protocol!=="https:") process.exit(1); require("fs").writeFileSync(process.env.NPM_CONFIG_USERCONFIG, `registry=${u.href}\n//${u.host}${u.pathname}:_authToken=\${NODE_AUTH_TOKEN}\n`);'
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile --ignore-scripts
          elif [ -f yarn.lock ]; then
            corepack enable
            version="$(yarn --version)"
            if [[ "$version" == 1.* ]]; then
              yarn install --frozen-lockfile --ignore-scripts
            elif [[ "$version" == 2.* ]]; then
              YARN_NPM_AUTH_TOKEN="${NODE_AUTH_TOKEN:-${NPM_TOKEN:-}}" YARN_ENABLE_SCRIPTS=false yarn install --immutable --skip-builds
            elif [[ "$version" =~ ^[3-9][0-9]*\. ]]; then
              YARN_NPM_AUTH_TOKEN="${NODE_AUTH_TOKEN:-${NPM_TOKEN:-}}" YARN_ENABLE_SCRIPTS=false yarn install --immutable --mode=skip-build
            else
              echo "::error::Unsupported Yarn generation."
              exit 1
            fi
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --ignore-scripts
          else
            echo "::error::No JavaScript lockfile found. Deployment requires frozen dependencies."
            exit 1
          fi

      - name: Build Node assets
        if: ${{ steps.node.outputs.enabled == 'true' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          BUILD_SCRIPT: ${{ inputs.build_script }}
        run: |
          set -euo pipefail
          unset COMPOSER_AUTH NODE_AUTH_TOKEN NPM_TOKEN SSH_AUTH_SOCK SSH_AGENT_PID GIT_SSH_COMMAND NPM_CONFIG_USERCONFIG
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts[process.env.BUILD_SCRIPT] ? 0 : 1)"; then
            if [ -f pnpm-lock.yaml ]; then
              pnpm run "$BUILD_SCRIPT"
            elif [ -f yarn.lock ]; then
              yarn "$BUILD_SCRIPT"
            else
              npm run "$BUILD_SCRIPT"
            fi
          fi

      - name: Install deployment dependencies
        working-directory: ${{ inputs.deployment_directory }}
        shell: bash
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
          INSTALL_SSH_KEY: ${{ secrets.INSTALL_SSH_KEY }}
          INSTALL_SSH_KNOWN_HOSTS: ${{ secrets.INSTALL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          if [ -n "$INSTALL_SSH_KEY" ]; then
            test -n "$INSTALL_SSH_KNOWN_HOSTS" || { echo "::error::Verified install host keys required."; exit 1; }
            printf '%s\n' "$INSTALL_SSH_KEY" > "$auth_dir/key"
            printf '%s\n' "$INSTALL_SSH_KNOWN_HOSTS" > "$auth_dir/known_hosts"
            while IFS= read -r host_key || [ -n "$host_key" ]; do
              [[ "$host_key" =~ ^[[:space:]]*(#|$) ]] && continue
              printf '%s\n' "$host_key" | ssh-keygen -l -f /dev/stdin >/dev/null
            done < "$auth_dir/known_hosts"
            ssh-keygen -l -f "$auth_dir/known_hosts" >/dev/null
            export GIT_SSH_COMMAND="ssh -i $auth_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$auth_dir/known_hosts"
          fi
          test -f composer.lock
          composer validate --strict --no-check-publish
          composer install --prefer-dist --no-dev --optimize-autoloader --no-progress --no-interaction --no-scripts --no-plugins

      - name: Install WireGuard tooling
        env:
          WIREGUARD_ENABLED: ${{ secrets.WIREGUARD_CONFIGURATION != '' }}
        if: ${{ env.WIREGUARD_ENABLED == 'true' }}
        run: |
          if ! command -v wg-quick >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wireguard-tools
          fi

      - name: Configure SSH known hosts
        env:
          DEPLOY_HOSTNAME: ${{ secrets.DEPLOY_HOSTNAME }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          ALLOW_SSH_KEYSCAN: ${{ inputs.allow_ssh_keyscan }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::Verified SSH_KNOWN_HOSTS required for deployment."; exit 1; }
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          while IFS= read -r host_key || [ -n "$host_key" ]; do
            [[ "$host_key" =~ ^[[:space:]]*(#|$) ]] && continue
            printf '%s\n' "$host_key" | ssh-keygen -l -f /dev/stdin >/dev/null
          done < ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null
          printf '%s\n' 'StrictHostKeyChecking yes' > ~/.ssh/config

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.GITHUB_USER_SSH_KEY }}

      - name: Set up WireGuard
        env:
          WIREGUARD_CONFIGURATION: ${{ secrets.WIREGUARD_CONFIGURATION }}
        if: ${{ env.WIREGUARD_CONFIGURATION != '' }}
        run: |
          umask 077
          config_file="$(mktemp)"
          trap 'rm -f "$config_file"' EXIT
          printf '%s\n' "$WIREGUARD_CONFIGURATION" > "$config_file"
          sudo install -m 600 "$config_file" /etc/wireguard/wg0.conf
          rm -f "$config_file"
          sudo wg-quick up wg0

      - name: Run Deployer
        id: run-deployer
        working-directory: ${{ inputs.deployment_directory }}
        shell: bash
        env:
          DEPLOY_HOSTNAME: ${{ secrets.DEPLOY_HOSTNAME }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_VERBOSITY: ${{ inputs.verbosity }}
          DEPLOY_COMMAND: ${{ inputs.deploy_command }}
          ALLOW_CUSTOM_DEPLOY_COMMAND: ${{ inputs.allow_custom_deploy_command }}
        run: |
          set -euo pipefail
          umask 077
          log_file="${RUNNER_TEMP}/deployer.log"
          trap 'status=$?; rm -f "$log_file"; printf "exit_code=%s\n" "$status" >> "$GITHUB_OUTPUT"' EXIT
          if [ "$DEPLOY_COMMAND" != "./vendor/bin/dep deploy" ] && [ "$ALLOW_CUSTOM_DEPLOY_COMMAND" != "true" ]; then
            echo "::error::deploy_command is restricted by default."
            exit 1
          fi
          [[ "$DEPLOY_ENVIRONMENT" =~ ^[A-Za-z0-9_.:-]+$ ]] || { echo "::error::Invalid environment."; exit 1; }
          [[ "$DEPLOY_VERBOSITY" =~ ^v{0,3}$ ]] || { echo "::error::Invalid verbosity."; exit 1; }
          args=(./vendor/bin/dep deploy "$DEPLOY_ENVIRONMENT")
          if [ -n "$DEPLOY_VERBOSITY" ]; then
            args+=("-$DEPLOY_VERBOSITY")
          fi
          set +e
          if [ "$DEPLOY_COMMAND" = "./vendor/bin/dep deploy" ]; then
            "${args[@]}" 2>&1 | tee "$log_file"
            statuses=("${PIPESTATUS[@]}")
          else
            bash -lc "$DEPLOY_COMMAND" -- "$DEPLOY_ENVIRONMENT" "$DEPLOY_VERBOSITY" 2>&1 | tee "$log_file"
            statuses=("${PIPESTATUS[@]}")
          fi
          set -e
          exit_code="${statuses[0]}"
          if [ "$exit_code" -eq 0 ] && [ "${statuses[1]}" -ne 0 ]; then
            exit_code="${statuses[1]}"
          fi
          if [ "$exit_code" -eq 0 ]; then
            echo 'reason=Deployment completed successfully.' >> "$GITHUB_OUTPUT"
          else
            echo 'reason=Deployment failed; inspect the protected runner log.' >> "$GITHUB_OUTPUT"
          fi
          echo 'warnings=' >> "$GITHUB_OUTPUT"
          echo 'log_excerpt=Raw deployment logs are restricted to the runner log.' >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Stop WireGuard
        if: ${{ always() }}
        run: |
          if [ -f /etc/wireguard/wg0.conf ]; then
            sudo wg-quick down wg0 || true
            sudo rm -f /etc/wireguard/wg0.conf
          fi

      - name: Remove deployment credentials
        if: ${{ always() }}
        shell: bash
        run: |
          ssh-add -D >/dev/null 2>&1 || true
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            kill "$SSH_AGENT_PID" || true
          fi
          rm -f ~/.ssh/known_hosts ~/.ssh/config "${RUNNER_TEMP}/deployer.log" "${RUNNER_TEMP}/.npmrc"

      - name: Fail on Deployer result
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOME: ${{ steps.run-deployer.outcome }}
          EXIT_CODE: ${{ steps.run-deployer.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != 'success' ] || [[ ! "$EXIT_CODE" =~ ^[0-9]+$ ]] || [ "$EXIT_CODE" != '0' ]; then
            echo "::error::Deployment did not produce a successful zero result."
            exit 1
          fi
