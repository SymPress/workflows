name: Deploy with Deployer

on:
  workflow_call:
    inputs:
      environment:
        description: Deployer environment/stage.
        type: string
        required: true
      verbosity:
        description: Deployer verbosity without leading dash.
        type: string
        default: v
        required: false
      working_directory:
        description: Repository directory to install before deployment.
        type: string
        default: .
        required: false
      deployment_directory:
        description: Directory containing Deployer composer.json and deploy config.
        type: string
        default: deployment
        required: false
      deploy_command:
        description: Command executed inside deployment_directory.
        type: string
        default: ./vendor/bin/dep deploy
        required: false
      allow_custom_deploy_command:
        description: Allow deploy_command values other than the default.
        type: boolean
        default: false
        required: false
      allow_ssh_keyscan:
        description: Allow ssh-keyscan fallback when SSH_KNOWN_HOSTS is not provided.
        type: boolean
        default: false
        required: false
      php_version:
        description: PHP version used for Composer and Deployer.
        type: string
        default: '8.5'
        required: false
      php_extensions:
        description: Extensions passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      php_tools:
        description: Additional tools passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      node_version:
        description: Node version used when package.json is present.
        type: string
        default: '24'
        required: false
      npm_registry_domain:
        description: npm registry URL.
        type: string
        default: https://npm.pkg.github.com/
        required: false
      allow_unpinned_node_install:
        description: Allow npm install when no lockfile exists. Keep disabled for reproducible CI.
        type: boolean
        default: false
        required: false
      build_script:
        description: Optional npm/yarn/pnpm build script before deployment.
        type: string
        default: build
        required: false
      use_ssh:
        description: Enable SSH transport; disable for local Deployer hosts without deployment keys.
        type: boolean
        default: true
        required: false
      artifact_attestation:
        description: Require signed build provenance and SBOM for the exact deployment archive.
        type: boolean
        default: false
        required: false
      attestation_signer_digest:
        description: Reviewed full commit SHA of the reusable workflow; required with artifact_attestation.
        type: string
        default: ''
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 30
        required: false
    secrets:
      COMPOSER_AUTH_JSON:
        description: Composer authentication JSON.
        required: false
      INSTALL_SSH_KEY:
        description: Separate read-only SSH key for fetching private Composer dependencies.
        required: false
      INSTALL_SSH_KNOWN_HOSTS:
        description: Verified host keys for private dependency fetches.
        required: false
      GITHUB_USER_SSH_KEY:
        description: SSH key used only for deployment targets; required when use_ssh is true.
        required: false
      DEPLOY_HOSTNAME:
        description: Host added to known_hosts before deployment.
        required: false
      DEPLOY_PORT:
        description: SSH port for known_hosts.
        required: false
      SSH_KNOWN_HOSTS:
        description: Trusted known_hosts contents for deployment targets.
        required: false
      DEPLOY_USER:
        description: Deployer user exposed as DEPLOY_USER.
        required: false
      WIREGUARD_CONFIGURATION:
        description: Optional wg-quick configuration.
        required: false
      NPM_REGISTRY_TOKEN:
        description: npm registry token.
        required: false
    outputs:
      deploy_exit_code:
        description: Deployer process exit code.
        value: ${{ jobs.deploy.outputs.deploy_exit_code }}
      deploy_reason:
        description: Human-readable deployment result.
        value: ${{ jobs.deploy.outputs.deploy_reason }}
      deploy_warnings:
        description: Warning lines parsed from Deployer output.
        value: ${{ jobs.deploy.outputs.deploy_warnings }}
      deploy_log_excerpt:
        description: Last lines from Deployer output.
        value: ${{ jobs.deploy.outputs.deploy_log_excerpt }}

permissions:
  contents: read

jobs:
  dependencies:
    name: Fetch locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      COMPOSER_NO_DEV: 1
      ALLOW_UNPINNED_NODE_INSTALL: ${{ inputs.allow_unpinned_node_install }}
    steps:
      - name: Set isolated Composer fetch cache
        shell: bash
        run: echo "COMPOSER_CACHE_DIR=${RUNNER_TEMP}/sympress-composer-cache" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2, ${{ inputs.php_tools }}
          coverage: none

      - name: Validate Composer metadata
        working-directory: ${{ inputs.working_directory }}
        run: |
          test -f composer.lock
          composer --no-plugins validate --strict --no-check-publish

      - name: Install project dependencies
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
          INSTALL_SSH_KEY: ${{ secrets.INSTALL_SSH_KEY }}
          INSTALL_SSH_KNOWN_HOSTS: ${{ secrets.INSTALL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          if [ -n "$INSTALL_SSH_KEY" ]; then
            test -n "$INSTALL_SSH_KNOWN_HOSTS" || { echo "::error::Verified install host keys required."; exit 1; }
            printf '%s\n' "$INSTALL_SSH_KEY" > "$auth_dir/key"
            printf '%s\n' "$INSTALL_SSH_KNOWN_HOSTS" > "$auth_dir/known_hosts"
            while IFS= read -r host_key || [ -n "$host_key" ]; do
              [[ "$host_key" =~ ^[[:space:]]*(#|$) ]] && continue
              printf '%s\n' "$host_key" | ssh-keygen -l -f /dev/stdin >/dev/null
            done < "$auth_dir/known_hosts"
            ssh-keygen -l -f "$auth_dir/known_hosts" >/dev/null
            export GIT_SSH_COMMAND="ssh -i $auth_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$auth_dir/known_hosts"
          fi
          composer install --prefer-dist --no-dev --optimize-autoloader --no-progress --no-interaction --no-scripts --no-plugins

      - name: Detect package.json
        id: node
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          test -f "$WD/package.json" && echo "enabled=true" >> "$GITHUB_OUTPUT" || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Detect package manager
        id: package-manager
        if: ${{ steps.node.outputs.enabled == 'true' }}
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          path_for() {
            if [ "$WD" = "." ]; then
              printf '%s' "$1"
            else
              printf '%s/%s' "${WD%/}" "$1"
            fi
          }

          if [ -f "$(path_for pnpm-lock.yaml)" ]; then
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for yarn.lock)" ]; then
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for yarn.lock)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for package-lock.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for package-lock.json)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for npm-shrinkwrap.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for npm-shrinkwrap.json)" >> "$GITHUB_OUTPUT"
          else
            echo "cache=" >> "$GITHUB_OUTPUT"
            echo "lockfile=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: ${{ steps.node.outputs.enabled == 'true' && steps.package-manager.outputs.cache == '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}

      - name: Set up Node for locked package manager
        if: ${{ steps.node.outputs.enabled == 'true' && steps.package-manager.outputs.cache != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}

      - name: Activate package manager
        if: ${{ steps.node.outputs.enabled == 'true' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ] || [ -f yarn.lock ]; then
            if ! command -v corepack >/dev/null 2>&1; then
              npm install --global corepack@0.34.6 --ignore-scripts --registry=https://registry.npmjs.org/
            fi
            corepack enable
          fi

      - name: Install Node dependencies
        if: ${{ steps.node.outputs.enabled == 'true' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
          REGISTRY_URL: ${{ inputs.npm_registry_domain }}
          YARN_ENABLE_GLOBAL_CACHE: 'false'
        run: |
          set -euo pipefail
          umask 077
          auth_file="$(mktemp)"
          trap 'rm -f "$auth_file"' EXIT
          export NPM_CONFIG_USERCONFIG="$auth_file"
          # Retain the registry token placeholder for npm.
          # shellcheck disable=SC2016
          node -e 'const u=new URL(process.env.REGISTRY_URL); if(u.protocol!=="https:") process.exit(1); require("fs").writeFileSync(process.env.NPM_CONFIG_USERCONFIG, `registry=${u.href}\n//${u.host}${u.pathname}:_authToken=\${NODE_AUTH_TOKEN}\n`);'
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile --ignore-scripts
          elif [ -f yarn.lock ]; then
            corepack enable
            version="$(yarn --version)"
            if [[ "$version" == 1.* ]]; then
              yarn install --frozen-lockfile --ignore-scripts
            elif [[ "$version" == 2.* ]]; then
              YARN_NPM_AUTH_TOKEN="${NODE_AUTH_TOKEN:-${NPM_TOKEN:-}}" YARN_ENABLE_SCRIPTS=false yarn install --immutable --skip-builds
            elif [[ "$version" =~ ^[3-9][0-9]*\. ]]; then
              YARN_NPM_AUTH_TOKEN="${NODE_AUTH_TOKEN:-${NPM_TOKEN:-}}" YARN_ENABLE_SCRIPTS=false yarn install --immutable --mode=skip-build
            else
              echo "::error::Unsupported Yarn generation."
              exit 1
            fi
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --ignore-scripts
          else
            echo "::error::No JavaScript lockfile found. Deployment requires frozen dependencies."
            exit 1
          fi

      - name: Install deployment dependencies
        working-directory: ${{ inputs.deployment_directory }}
        shell: bash
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
          INSTALL_SSH_KEY: ${{ secrets.INSTALL_SSH_KEY }}
          INSTALL_SSH_KNOWN_HOSTS: ${{ secrets.INSTALL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          if [ -n "$INSTALL_SSH_KEY" ]; then
            test -n "$INSTALL_SSH_KNOWN_HOSTS" || { echo "::error::Verified install host keys required."; exit 1; }
            printf '%s\n' "$INSTALL_SSH_KEY" > "$auth_dir/key"
            printf '%s\n' "$INSTALL_SSH_KNOWN_HOSTS" > "$auth_dir/known_hosts"
            while IFS= read -r host_key || [ -n "$host_key" ]; do
              [[ "$host_key" =~ ^[[:space:]]*(#|$) ]] && continue
              printf '%s\n' "$host_key" | ssh-keygen -l -f /dev/stdin >/dev/null
            done < "$auth_dir/known_hosts"
            ssh-keygen -l -f "$auth_dir/known_hosts" >/dev/null
            export GIT_SSH_COMMAND="ssh -i $auth_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$auth_dir/known_hosts"
          fi
          test -f composer.lock
          composer --no-plugins validate --strict --no-check-publish
          composer install --prefer-dist --no-dev --optimize-autoloader --no-progress --no-interaction --no-scripts --no-plugins

      - name: Package dependencies artifact
        shell: bash
        env:
          ARTIFACT_KIND: dependencies
          NODE_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import io, json, os, pathlib, re, subprocess, tarfile
          root = pathlib.Path.cwd()
          kind = os.environ['ARTIFACT_KIND']
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / (kind + '.tgz')
          excluded = {'.git', '.ssh', '.npm', '.cache', '.sympress-composer-cache', 'operations-state', 'auth.json', '.npmrc', '.yarnrc.yml'}
          if kind == 'release':
              excluded.add('node_modules')
          def private(parts):
              return any(p in excluded or (p.startswith('.env') and not (kind == 'dependencies' and p == '.env.example')) for p in parts)
          protected_inodes = set()
          for path in root.rglob('*'):
              if path.is_file() and private(path.relative_to(root).parts):
                  stat = path.stat()
                  protected_inodes.add((stat.st_dev, stat.st_ino))
          def safe(info):
              parts = pathlib.PurePosixPath(info.name).parts
              if private(parts):
                  return None
              if info.isfile() or info.islnk() or (info.issym() and (root / info.name).is_file()):
                  stat = (root / info.name).stat()
                  if (stat.st_dev, stat.st_ino) in protected_inodes:
                      raise RuntimeError('Artifact alias reaches a private file: ' + info.name)
              if info.issym():
                  resolved = (root / info.name).resolve(strict=True)
                  info.linkname = os.path.relpath(resolved, (root / info.name).parent)
              elif info.islnk():
                  resolved = (root / info.linkname).resolve(strict=True)
                  if not resolved.is_relative_to(root) or private(resolved.relative_to(root).parts):
                      raise RuntimeError('Artifact hardlink reaches a private or external file: ' + info.name)
                  info.linkname = resolved.relative_to(root).as_posix()
              if not (info.isfile() or info.isdir() or info.issym() or info.islnk()):
                  raise RuntimeError('Unsupported deployment artifact entry: ' + info.name)
              return info
          metadata = root / '.sympress-artifact.json'
          if metadata.is_symlink() or (metadata.is_file() and metadata.stat().st_nlink > 1):
              raise RuntimeError('Artifact metadata must not alias another file')
          metadata.write_text(json.dumps({'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'kind': kind}))
          for path in root.rglob('*'):
              if path.is_symlink():
                  if pathlib.Path(os.readlink(path)).is_absolute():
                      raise RuntimeError('Artifact link must be relative: ' + str(path.relative_to(root)))
                  resolved = path.resolve(strict=True)
                  if not resolved.is_relative_to(root):
                      raise RuntimeError('Artifact link escapes workspace: ' + str(path.relative_to(root)))
                  if not private(path.relative_to(root).parts) and private(resolved.relative_to(root).parts):
                      raise RuntimeError('Artifact link reaches a private file: ' + str(path.relative_to(root)))
          yarn_config = None
          working = (root / os.environ.get('NODE_WORKING_DIRECTORY', '.')).resolve(strict=True)
          if not working.is_relative_to(root):
              raise RuntimeError('Node working directory escapes workspace')
          configs = [directory / '.yarnrc.yml' for directory in [working, *working.parents]
                     if directory.is_relative_to(root) and (directory / '.yarnrc.yml').is_file()]
          if (working / 'yarn.lock').is_file() and configs:
              # Ask Yarn only for public settings; never archive its authentication configuration.
              yarn_env = dict(os.environ, YARN_ENABLE_SCRIPTS='false', YARN_ENABLE_GLOBAL_CACHE='false')
              for config in configs:
                  for variable in re.findall(r'\$\{([A-Za-z_][A-Za-z0-9_]*)', config.read_text()):
                      yarn_env[variable] = ''
              def yarn(arguments):
                  result = subprocess.run(['yarn', *arguments], cwd=working, env=yarn_env,
                                          capture_output=True, text=True, timeout=30)
                  if result.returncode:
                      raise RuntimeError('Cannot read public Yarn build configuration')
                  return result.stdout.strip()
              if not yarn(['--version']).startswith('1.'):
                  linker = json.loads(yarn(['config', 'get', 'nodeLinker', '--json']))
                  if linker not in {'pnp', 'pnpm', 'node-modules'}:
                      raise RuntimeError('Unsupported Yarn nodeLinker')
                  yarn_config = {'nodeLinker': linker, 'enableGlobalCache': False}
                  for setting in ['yarnPath', 'cacheFolder']:
                      value = json.loads(yarn(['config', 'get', setting, '--json']))
                      if value is None and setting == 'yarnPath':
                          continue
                      if not isinstance(value, str):
                          raise RuntimeError('Invalid public Yarn path setting: ' + setting)
                      resolved = (working / value).resolve()
                      if not resolved.is_relative_to(root) or private(resolved.relative_to(root).parts):
                          raise RuntimeError('Yarn build path reaches a private or external file: ' + setting)
                      yarn_config[setting] = os.path.relpath(resolved, working)
          with tarfile.open(target, 'w:gz', dereference=False) as archive:
              archive.add(root, arcname='.', filter=safe)
              # Reinstallation by Composer installers must work without credentials.
              # Copy package bytes only, never repository metadata, remotes or hooks.
              cache = pathlib.Path(os.environ.get('COMPOSER_CACHE_DIR', str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'sympress-composer-cache')))
              def cache_file(path, relative, git_object=False):
                  if path.is_symlink() or not path.is_file() or (path.stat().st_nlink != 1 and not git_object):
                      raise RuntimeError('Composer cache entry must be a regular unlinked file: ' + str(relative))
                  if any(parent.is_symlink() for parent in path.parents):
                      raise RuntimeError('Composer cache directory must not be a symlink')
                  # Git clones legitimately hardlink immutable objects. Serialize bytes,
                  # never links, so the artifact cannot acquire an external alias.
                  info = tarfile.TarInfo('.sympress-composer-cache/' + relative.as_posix())
                  info.size = path.stat().st_size
                  info.mode, info.uid, info.gid, info.uname, info.gname = 0o600, 0, 0, '', ''
                  with path.open('rb') as content:
                      archive.addfile(info, content)
              if (cache / 'files').is_dir():
                  for path in sorted((cache / 'files').rglob('*')):
                      if path.is_file() or path.is_symlink():
                          cache_file(path, path.relative_to(cache))
              if (cache / 'vcs').is_dir():
                  for repository in sorted((cache / 'vcs').iterdir()):
                      if repository.is_symlink() or not repository.is_dir():
                          raise RuntimeError('Invalid Composer Git cache directory')
                      for name in ['HEAD', 'packed-refs', 'shallow']:
                          path = repository / name
                          if path.exists() or path.is_symlink():
                              cache_file(path, path.relative_to(cache))
                      for name in ['objects', 'refs']:
                          info = tarfile.TarInfo('.sympress-composer-cache/vcs/' + repository.name + '/' + name)
                          info.type, info.mode = tarfile.DIRTYPE, 0o700
                          archive.addfile(info)
                          for path in sorted((repository / name).rglob('*')):
                              relative = path.relative_to(repository)
                              # Alternate object stores could escape the cache boundary.
                              if relative.parts[:2] == ('objects', 'info'):
                                  continue
                              if path.is_file() or path.is_symlink():
                                  cache_file(path, path.relative_to(cache), git_object=name == 'objects')
                      content = b'[core]\n\trepositoryformatversion = 0\n\tbare = true\n'
                      info = tarfile.TarInfo('.sympress-composer-cache/vcs/' + repository.name + '/config')
                      info.size, info.mode = len(content), 0o600
                      archive.addfile(info, io.BytesIO(content))
              if yarn_config is not None:
                  content = json.dumps(yarn_config).encode()
                  info = tarfile.TarInfo((working.relative_to(root) / '.yarnrc.yml').as_posix())
                  info.size, info.mode = len(content), 0o600
                  archive.addfile(info, io.BytesIO(content))
          PY

      - name: Upload dependencies artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sympress-deploy-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependencies.tgz
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build without deployment secrets
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      release_sha256: ${{ steps.release-package.outputs.sha256 }}
    env:
      COMPOSER_NO_DEV: 1
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/.sympress-composer-cache
    steps:
      - name: Download dependencies artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.dependencies.outputs.artifact_id }}
          path: ${{ runner.temp }}/sympress-dependencies

      - name: Restore dependencies artifact
        shell: bash
        env:
          ARTIFACT_KIND: dependencies
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, tarfile
          root = pathlib.Path.cwd()
          kind = os.environ['ARTIFACT_KIND']
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / ('sympress-' + kind) / (kind + '.tgz')
          with tarfile.open(source) as archive:
              archive.extractall(root, filter='data')
          metadata = json.loads((root / '.sympress-artifact.json').read_text())
          if metadata != {'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'kind': kind}:
              raise RuntimeError('Artifact provenance mismatch')
          PY

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2, ${{ inputs.php_tools }}
          coverage: none

      - name: Detect package.json
        id: node
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          test -f "$WD/package.json" && echo "enabled=true" >> "$GITHUB_OUTPUT" || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: ${{ steps.node.outputs.enabled == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Activate package manager
        if: ${{ steps.node.outputs.enabled == 'true' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ] || [ -f yarn.lock ]; then
            if ! command -v corepack >/dev/null 2>&1; then
              npm install --global corepack@0.34.6 --ignore-scripts --registry=https://registry.npmjs.org/
            fi
            corepack enable
          fi

      - name: Build Node assets
        if: ${{ steps.node.outputs.enabled == 'true' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          BUILD_SCRIPT: ${{ inputs.build_script }}
          COMPOSER_DISABLE_NETWORK: '1'
        run: |
          set -euo pipefail
          unset COMPOSER_AUTH NODE_AUTH_TOKEN NPM_TOKEN SSH_AUTH_SOCK SSH_AGENT_PID GIT_SSH_COMMAND NPM_CONFIG_USERCONFIG
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts[process.env.BUILD_SCRIPT] ? 0 : 1)"; then
            if [ -f pnpm-lock.yaml ]; then
              pnpm run "$BUILD_SCRIPT"
            elif [ -f yarn.lock ]; then
              yarn "$BUILD_SCRIPT"
            else
              npm run "$BUILD_SCRIPT"
            fi
          fi

      - name: Audit production Composer dependencies
        working-directory: ${{ inputs.working_directory }}
        run: composer --no-plugins audit --locked --no-dev --no-interaction

      - name: Audit Node dependencies
        if: ${{ steps.node.outputs.enabled == 'true' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          unset COMPOSER_AUTH NODE_AUTH_TOKEN NPM_TOKEN SSH_AUTH_SOCK SSH_AGENT_PID GIT_SSH_COMMAND NPM_CONFIG_USERCONFIG
          if [ -f pnpm-lock.yaml ]; then
            pnpm audit --audit-level high
          elif [ -f yarn.lock ]; then
            if [[ "$(yarn --version)" == 1.* ]]; then
              report="$(mktemp)"
              trap 'rm -f "$report"' EXIT
              set +e
              yarn audit --json > "$report"
              result=$?
              set -e
              # An absent summary also rejects registry/network failures.
              python3 - "$report" "$result" <<'PY'
          import json, sys
          summaries = [e['data']['vulnerabilities'] for e in
                       (json.loads(line) for line in open(sys.argv[1])) if e.get('type') == 'auditSummary']
          if len(summaries) != 1 or int(sys.argv[2]) > 31 or (int(sys.argv[2]) & 24):
              raise SystemExit('Yarn audit did not establish a passing release gate.')
          if summaries[0].get('high', 0) or summaries[0].get('critical', 0):
              raise SystemExit('High or critical Node advisory blocks release.')
          PY
            else
              yarn npm audit --all --recursive --severity high
            fi
          else
            npm audit --audit-level high
          fi

      - name: Generate production SBOM
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, uuid
          root = pathlib.Path.cwd().resolve()
          working = (root / os.environ['WD']).resolve()
          if not working.is_relative_to(root):
              raise RuntimeError('Invalid SBOM working directory')
          components = {}
          def add(name, version, ecosystem, role):
              if not isinstance(name, str) or not name or not isinstance(version, str) or not version:
                  raise RuntimeError('Invalid installed component metadata')
              purl = 'pkg:' + ecosystem + '/' + urllib.parse.quote(name, safe='/') + '@' + urllib.parse.quote(version, safe='')
              components[purl] = {'type': 'library', 'name': name, 'version': version, 'bom-ref': purl, 'purl': purl,
                                  'properties': [{'name': 'sympress:inventory-source', 'value': role}]}
          installed = working / 'vendor/composer/installed.json'
          if not installed.is_file() or not installed.resolve().is_relative_to(root):
              raise RuntimeError('Installed Composer metadata required for SBOM')
          inventory = json.loads(installed.read_text())
          packages = inventory.get('packages') if isinstance(inventory, dict) else inventory
          if not isinstance(packages, list):
              raise RuntimeError('Invalid Composer inventory')
          lock = json.loads((working / 'composer.lock').read_text())
          dev = {p['name'] for p in lock.get('packages-dev', [])}
          for package in packages:
              if package.get('name') in dev:
                  raise RuntimeError('Development package remains in release inventory')
              add(package.get('name'), package.get('version'), 'composer', 'installed-production-package')
          node_lock = working / 'package-lock.json'
          if node_lock.is_file():
              node = json.loads(node_lock.read_text())
              if not isinstance(node.get('packages'), dict):
                  raise RuntimeError('SBOM requires package-lock v2 or v3')
              for location, package in node['packages'].items():
                  if not location or package.get('dev') or package.get('link'):
                      continue
                  name = package.get('name') or location.rsplit('node_modules/', 1)[-1]
                  add(name, package.get('version'), 'npm', 'locked-production-build-input')
          limitations = []
          if (working / 'package.json').is_file() and not node_lock.is_file():
              limitations.append({'name': 'sympress:inventory-limitation', 'value': 'Non-npm JavaScript build inputs are not inventoried; Composer production inventory is complete.'})
          serial = uuid.uuid5(uuid.NAMESPACE_URL, 'https://github.com/' + os.environ['GITHUB_REPOSITORY']
                             + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/' + os.environ['GITHUB_SHA'])
          sbom = {'bomFormat': 'CycloneDX', 'specVersion': '1.6', 'version': 1, 'serialNumber': 'urn:uuid:' + str(serial),
                  'metadata': {'component': {'type': 'application', 'name': os.environ['GITHUB_REPOSITORY'],
                                            'version': os.environ['GITHUB_SHA']}, 'properties': limitations},
                  'components': [components[k] for k in sorted(components)]}
          target = root / 'sympress-sbom.cdx.json'
          if target.is_symlink() or (target.exists() and target.stat().st_nlink != 1):
              raise RuntimeError('SBOM output must not alias existing files')
          target.write_text(json.dumps(sbom, sort_keys=True, indent=2) + '\n')
          PY

      - name: Package release artifact
        id: release-package
        shell: bash
        env:
          ARTIFACT_KIND: release
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os, pathlib, tarfile
          root = pathlib.Path.cwd()
          kind = os.environ['ARTIFACT_KIND']
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / (kind + '.tgz')
          excluded = {'.git', '.ssh', '.npm', '.cache', '.sympress-composer-cache', 'operations-state', 'auth.json', '.npmrc', '.yarnrc.yml'}
          if kind == 'release':
              excluded.add('node_modules')
          def private(parts):
              return any(p in excluded or (p.startswith('.env') and not (kind == 'dependencies' and p == '.env.example')) for p in parts)
          protected_inodes = set()
          for path in root.rglob('*'):
              if path.is_file() and private(path.relative_to(root).parts):
                  stat = path.stat()
                  protected_inodes.add((stat.st_dev, stat.st_ino))
          def safe(info):
              parts = pathlib.PurePosixPath(info.name).parts
              if private(parts):
                  return None
              if info.isfile() or info.islnk() or (info.issym() and (root / info.name).is_file()):
                  stat = (root / info.name).stat()
                  if (stat.st_dev, stat.st_ino) in protected_inodes:
                      raise RuntimeError('Artifact alias reaches a private file: ' + info.name)
              if info.issym():
                  resolved = (root / info.name).resolve(strict=True)
                  info.linkname = os.path.relpath(resolved, (root / info.name).parent)
              elif info.islnk():
                  resolved = (root / info.linkname).resolve(strict=True)
                  if not resolved.is_relative_to(root) or private(resolved.relative_to(root).parts):
                      raise RuntimeError('Artifact hardlink reaches a private or external file: ' + info.name)
                  info.linkname = resolved.relative_to(root).as_posix()
              if not (info.isfile() or info.isdir() or info.issym() or info.islnk()):
                  raise RuntimeError('Unsupported deployment artifact entry: ' + info.name)
              return info
          metadata = root / '.sympress-artifact.json'
          if metadata.is_symlink() or (metadata.is_file() and metadata.stat().st_nlink > 1):
              raise RuntimeError('Artifact metadata must not alias another file')
          metadata.write_text(json.dumps({'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'kind': kind}))
          for path in root.rglob('*'):
              if path.is_symlink():
                  if pathlib.Path(os.readlink(path)).is_absolute():
                      raise RuntimeError('Artifact link must be relative: ' + str(path.relative_to(root)))
                  resolved = path.resolve(strict=True)
                  if not resolved.is_relative_to(root):
                      raise RuntimeError('Artifact link escapes workspace: ' + str(path.relative_to(root)))
                  if not private(path.relative_to(root).parts) and private(resolved.relative_to(root).parts):
                      raise RuntimeError('Artifact link reaches a private file: ' + str(path.relative_to(root)))
          with tarfile.open(target, 'w:gz', dereference=False) as archive:
              archive.add(root, arcname='.', filter=safe)
          PY
          digest="$(sha256sum "${RUNNER_TEMP}/release.tgz" | cut -d ' ' -f 1)"
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sympress-deploy-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release.tgz
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest the deployment archive
    needs: build
    if: ${{ inputs.artifact_attestation }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Download the exact release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/sympress-release
      - name: Verify archive digest before signing
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.release_sha256 }}
          SIGNER_DIGEST: ${{ inputs.attestation_signer_digest }}
        run: |
          set -euo pipefail
          [[ "$SIGNER_DIGEST" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::A reviewed attestation_signer_digest is required."; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          actual="$(sha256sum "${RUNNER_TEMP}/sympress-release/release.tgz" | cut -d ' ' -f 1)"
          test "$actual" = "$EXPECTED_SHA256"
          python3 - <<'PY'
          import json, os, pathlib, tarfile, uuid
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sympress-release'
          with tarfile.open(directory / 'release.tgz') as archive:
              member = archive.getmember('./sympress-sbom.cdx.json')
              if not member.isfile() or member.size > 16 * 1024 * 1024:
                  raise RuntimeError('Invalid SBOM attestation subject')
              content = archive.extractfile(member).read()
          sbom = json.loads(content)
          if sbom.get('bomFormat') != 'CycloneDX' or sbom.get('specVersion') != '1.6':
              raise RuntimeError('Required CycloneDX SBOM missing')
          serial = sbom.get('serialNumber', '')
          if not serial.startswith('urn:uuid:') or str(uuid.UUID(serial[9:])) != serial[9:]:
              raise RuntimeError('Required SBOM attestation serial number missing')
          (directory / 'sbom.cdx.json').write_bytes(content)
          PY
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/sympress-release/release.tgz
      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/sympress-release/release.tgz
          sbom-path: ${{ runner.temp }}/sympress-release/sbom.cdx.json

  deploy:
    name: Deploy
    needs: [build, attest]
    if: ${{ always() && needs.build.result == 'success' && (!inputs.artifact_attestation || needs.attest.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      deploy_exit_code: ${{ steps.run-deployer.outputs.exit_code }}
      deploy_reason: ${{ steps.run-deployer.outputs.reason }}
      deploy_warnings: ${{ steps.run-deployer.outputs.warnings }}
      deploy_log_excerpt: ${{ steps.run-deployer.outputs.log_excerpt }}
    env:
      COMPOSER_NO_DEV: 1
    steps:
      - name: Checkout trusted deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: sympress-trusted-deployment
          persist-credentials: false

      - name: Validate trusted deployment directory
        id: trusted-source
        shell: bash
        env:
          DEPLOYMENT_DIRECTORY: ${{ inputs.deployment_directory }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, subprocess
          root = pathlib.Path('sympress-trusted-deployment').resolve(strict=True)
          if subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip() != os.environ['GITHUB_SHA']:
              raise RuntimeError('Deployment source commit mismatch')
          requested = pathlib.PurePosixPath(os.environ['DEPLOYMENT_DIRECTORY'])
          if requested.is_absolute() or '..' in requested.parts:
              raise RuntimeError('Deployment directory must remain inside the trusted checkout')
          directory = root.joinpath(requested)
          if directory.resolve(strict=True) != directory or not directory.is_dir():
              raise RuntimeError('Deployment directory must not contain symlinks')
          for name in ['composer.json', 'composer.lock', 'deploy.php']:
              file = directory / name
              if not file.is_file() or file.is_symlink() or file.stat().st_nlink != 1:
                  raise RuntimeError('Regular trusted deployment source required: ' + name)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('directory=' + str(directory) + '\n')
          PY

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2, ${{ inputs.php_tools }}
          coverage: none

      - name: Install trusted deployment dependencies
        working-directory: ${{ steps.trusted-source.outputs.directory }}
        shell: bash
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
          INSTALL_SSH_KEY: ${{ secrets.INSTALL_SSH_KEY }}
          INSTALL_SSH_KNOWN_HOSTS: ${{ secrets.INSTALL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          if [ -n "$INSTALL_SSH_KEY" ]; then
            test -n "$INSTALL_SSH_KNOWN_HOSTS" || { echo "::error::Verified install host keys required."; exit 1; }
            printf '%s\n' "$INSTALL_SSH_KEY" > "$auth_dir/key"
            printf '%s\n' "$INSTALL_SSH_KNOWN_HOSTS" > "$auth_dir/known_hosts"
            while IFS= read -r host_key || [ -n "$host_key" ]; do
              [[ "$host_key" =~ ^[[:space:]]*(#|$) ]] && continue
              printf '%s\n' "$host_key" | ssh-keygen -l -f /dev/stdin >/dev/null
            done < "$auth_dir/known_hosts"
            ssh-keygen -l -f "$auth_dir/known_hosts" >/dev/null
            export GIT_SSH_COMMAND="ssh -i $auth_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$auth_dir/known_hosts"
          fi
          composer --no-plugins validate --strict --no-check-publish
          composer install --prefer-dist --no-dev --optimize-autoloader --no-progress --no-interaction --no-scripts --no-plugins

      - name: Verify trusted deployment tools
        shell: bash
        env:
          TRUSTED_DEPLOYMENT_DIRECTORY: ${{ steps.trusted-source.outputs.directory }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path('sympress-trusted-deployment').resolve(strict=True)
          directory = pathlib.Path(os.environ['TRUSTED_DEPLOYMENT_DIRECTORY'])
          if directory.resolve(strict=True) != directory or not directory.is_relative_to(root):
              raise RuntimeError('Deployment tools escaped the trusted checkout')
          for name in ['deploy.php', 'vendor/bin/dep', 'vendor/deployer/deployer/bin/dep']:
              file = directory / name
              if not file.is_file() or file.is_symlink() or file.stat().st_nlink != 1 or not file.resolve(strict=True).is_relative_to(root):
                  raise RuntimeError('Regular trusted deployment tool required: ' + name)
          for file in directory.rglob('*'):
              if file.is_symlink() and not file.resolve(strict=True).is_relative_to(root):
                  raise RuntimeError('Deployment dependency link escaped the trusted checkout')
          PY

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/sympress-release

      - name: Verify the deployment archive before extraction
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.release_sha256 }}
          REQUIRE_ATTESTATION: ${{ inputs.artifact_attestation }}
          SIGNER_DIGEST: ${{ inputs.attestation_signer_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          archive="${RUNNER_TEMP}/sympress-release/release.tgz"
          actual="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          test "$actual" = "$EXPECTED_SHA256"
          if [ "$REQUIRE_ATTESTATION" = true ]; then
            [[ "$SIGNER_DIGEST" =~ ^[a-f0-9]{40}$ ]]
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow SymPress/workflows/.github/workflows/deploy-deployer.yml \
              --signer-digest "$SIGNER_DIGEST" --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          fi

      - name: Restore release artifact
        id: release-payload
        shell: bash
        env:
          ARTIFACT_KIND: release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sympress-release-payload'
          root.mkdir(mode=0o700)
          kind = os.environ['ARTIFACT_KIND']
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / ('sympress-' + kind) / (kind + '.tgz')
          with tarfile.open(source) as archive:
              archive.extractall(root, filter='data')
          metadata = json.loads((root / '.sympress-artifact.json').read_text())
          if metadata != {'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'kind': kind}:
              raise RuntimeError('Artifact provenance mismatch')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('directory=' + str(root.resolve(strict=True)) + '\n')
          PY

      - name: Install WireGuard tooling
        env:
          WIREGUARD_ENABLED: ${{ secrets.WIREGUARD_CONFIGURATION != '' }}
        if: ${{ inputs.use_ssh && (env.WIREGUARD_ENABLED == 'true') }}
        run: |
          if ! command -v wg-quick >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wireguard-tools
          fi

      - name: Configure SSH known hosts
        if: ${{ inputs.use_ssh }}
        env:
          DEPLOY_HOSTNAME: ${{ secrets.DEPLOY_HOSTNAME }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.GITHUB_USER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          ALLOW_SSH_KEYSCAN: ${{ inputs.allow_ssh_keyscan }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::Deployment SSH key required when use_ssh is true."; exit 1; }
          mkdir -p ~/.ssh
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::Verified SSH_KNOWN_HOSTS required for deployment."; exit 1; }
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          while IFS= read -r host_key || [ -n "$host_key" ]; do
            [[ "$host_key" =~ ^[[:space:]]*(#|$) ]] && continue
            printf '%s\n' "$host_key" | ssh-keygen -l -f /dev/stdin >/dev/null
          done < ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null
          printf '%s\n' 'StrictHostKeyChecking yes' > ~/.ssh/config

      - name: Set up SSH
        if: ${{ inputs.use_ssh }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.GITHUB_USER_SSH_KEY }}

      - name: Set up WireGuard
        env:
          WIREGUARD_CONFIGURATION: ${{ secrets.WIREGUARD_CONFIGURATION }}
        if: ${{ inputs.use_ssh && (env.WIREGUARD_CONFIGURATION != '') }}
        run: |
          umask 077
          config_file="$(mktemp)"
          trap 'rm -f "$config_file"' EXIT
          printf '%s\n' "$WIREGUARD_CONFIGURATION" > "$config_file"
          sudo install -m 600 "$config_file" /etc/wireguard/wg0.conf
          rm -f "$config_file"
          sudo wg-quick up wg0

      - name: Run Deployer
        id: run-deployer
        working-directory: ${{ steps.trusted-source.outputs.directory }}
        shell: bash
        env:
          DEPLOY_HOSTNAME: ${{ secrets.DEPLOY_HOSTNAME }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_VERBOSITY: ${{ inputs.verbosity }}
          DEPLOY_COMMAND: ${{ inputs.deploy_command }}
          ALLOW_CUSTOM_DEPLOY_COMMAND: ${{ inputs.allow_custom_deploy_command }}
          SYMPRESS_RELEASE_DIRECTORY: ${{ steps.release-payload.outputs.directory }}
        run: |
          set -euo pipefail
          umask 077
          log_file="${RUNNER_TEMP}/deployer.log"
          trap 'status=$?; rm -f "$log_file"; printf "exit_code=%s\n" "$status" >> "$GITHUB_OUTPUT"' EXIT
          if [ "$DEPLOY_COMMAND" != "./vendor/bin/dep deploy" ] && [ "$ALLOW_CUSTOM_DEPLOY_COMMAND" != "true" ]; then
            echo "::error::deploy_command is restricted by default."
            exit 1
          fi
          [[ "$DEPLOY_ENVIRONMENT" =~ ^[A-Za-z0-9_.:-]+$ ]] || { echo "::error::Invalid environment."; exit 1; }
          [[ "$DEPLOY_VERBOSITY" =~ ^v{0,3}$ ]] || { echo "::error::Invalid verbosity."; exit 1; }
          args=(./vendor/bin/dep deploy "$DEPLOY_ENVIRONMENT")
          if [ -n "$DEPLOY_VERBOSITY" ]; then
            args+=("-$DEPLOY_VERBOSITY")
          fi
          set +e
          if [ "$DEPLOY_COMMAND" = "./vendor/bin/dep deploy" ]; then
            "${args[@]}" 2>&1 | tee "$log_file"
            statuses=("${PIPESTATUS[@]}")
          else
            bash -lc "$DEPLOY_COMMAND" -- "$DEPLOY_ENVIRONMENT" "$DEPLOY_VERBOSITY" 2>&1 | tee "$log_file"
            statuses=("${PIPESTATUS[@]}")
          fi
          set -e
          exit_code="${statuses[0]}"
          if [ "$exit_code" -eq 0 ] && [ "${statuses[1]}" -ne 0 ]; then
            exit_code="${statuses[1]}"
          fi
          if [ "$exit_code" -eq 0 ]; then
            echo 'reason=Deployment completed successfully.' >> "$GITHUB_OUTPUT"
          else
            echo 'reason=Deployment failed; inspect the protected runner log.' >> "$GITHUB_OUTPUT"
          fi
          echo 'warnings=' >> "$GITHUB_OUTPUT"
          echo 'log_excerpt=Raw deployment logs are restricted to the runner log.' >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Stop WireGuard
        if: ${{ always() }}
        run: |
          if [ -f /etc/wireguard/wg0.conf ]; then
            sudo wg-quick down wg0 || true
            sudo rm -f /etc/wireguard/wg0.conf
          fi

      - name: Remove deployment credentials
        if: ${{ always() }}
        shell: bash
        run: |
          ssh-add -D >/dev/null 2>&1 || true
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            kill "$SSH_AGENT_PID" || true
          fi
          rm -f ~/.ssh/known_hosts ~/.ssh/config "${RUNNER_TEMP}/deployer.log" "${RUNNER_TEMP}/.npmrc"

      - name: Fail on Deployer result
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOME: ${{ steps.run-deployer.outcome }}
          EXIT_CODE: ${{ steps.run-deployer.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != 'success' ] || [[ ! "$EXIT_CODE" =~ ^[0-9]+$ ]] || [ "$EXIT_CODE" != '0' ]; then
            echo "::error::Deployment did not produce a successful zero result."
            exit 1
          fi
