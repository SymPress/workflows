name: Deploy with Deployer

on:
  workflow_call:
    inputs:
      environment:
        description: Deployer environment/stage.
        type: string
        required: true
      verbosity:
        description: Deployer verbosity without leading dash.
        type: string
        default: v
        required: false
      working_directory:
        description: Repository directory to install before deployment.
        type: string
        default: .
        required: false
      deployment_directory:
        description: Directory containing Deployer composer.json and deploy config.
        type: string
        default: deployment
        required: false
      deploy_command:
        description: Command executed inside deployment_directory.
        type: string
        default: ./vendor/bin/dep deploy
        required: false
      allow_custom_deploy_command:
        description: Allow deploy_command values other than the default.
        type: boolean
        default: false
        required: false
      allow_ssh_keyscan:
        description: Allow ssh-keyscan fallback when SSH_KNOWN_HOSTS is not provided.
        type: boolean
        default: false
        required: false
      php_version:
        description: PHP version used for Composer and Deployer.
        type: string
        default: '8.5'
        required: false
      php_extensions:
        description: Extensions passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      php_tools:
        description: Additional tools passed to shivammathur/setup-php.
        type: string
        default: ''
        required: false
      node_version:
        description: Node version used when package.json is present.
        type: string
        default: '24'
        required: false
      npm_registry_domain:
        description: npm registry URL.
        type: string
        default: https://npm.pkg.github.com/
        required: false
      build_script:
        description: Optional npm/yarn/pnpm build script before deployment.
        type: string
        default: build
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 30
        required: false
    secrets:
      COMPOSER_AUTH_JSON:
        description: Composer authentication JSON.
        required: false
      GITHUB_USER_SSH_KEY:
        description: SSH key used for deployment targets and private dependencies.
        required: true
      DEPLOY_HOSTNAME:
        description: Host added to known_hosts before deployment.
        required: false
      DEPLOY_PORT:
        description: SSH port for known_hosts.
        required: false
      SSH_KNOWN_HOSTS:
        description: Trusted known_hosts contents for deployment targets.
        required: false
      DEPLOY_USER:
        description: Deployer user exposed as DEPLOY_USER.
        required: false
      WIREGUARD_CONFIGURATION:
        description: Optional wg-quick configuration.
        required: false
      NPM_REGISTRY_TOKEN:
        description: npm registry token.
        required: false
    outputs:
      deploy_exit_code:
        description: Deployer process exit code.
        value: ${{ jobs.deploy.outputs.deploy_exit_code }}
      deploy_reason:
        description: Human-readable deployment result.
        value: ${{ jobs.deploy.outputs.deploy_reason }}
      deploy_warnings:
        description: Warning lines parsed from Deployer output.
        value: ${{ jobs.deploy.outputs.deploy_warnings }}
      deploy_log_excerpt:
        description: Last lines from Deployer output.
        value: ${{ jobs.deploy.outputs.deploy_log_excerpt }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      deploy_exit_code: ${{ steps.run-deployer.outputs.exit_code }}
      deploy_reason: ${{ steps.run-deployer.outputs.reason }}
      deploy_warnings: ${{ steps.run-deployer.outputs.warnings }}
      deploy_log_excerpt: ${{ steps.run-deployer.outputs.log_excerpt }}
    env:
      COMPOSER_NO_DEV: 1
      NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.GITHUB_USER_SSH_KEY }}

      - name: Set up WireGuard
        env:
          WIREGUARD_CONFIGURATION: ${{ secrets.WIREGUARD_CONFIGURATION }}
        if: ${{ env.WIREGUARD_CONFIGURATION != '' }}
        run: |
          if ! command -v wg-quick >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wireguard-tools
          fi
          printf '%s\n' "$WIREGUARD_CONFIGURATION" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2, ${{ inputs.php_tools }}
          coverage: none

      - name: Validate Composer metadata
        working-directory: ${{ inputs.working_directory }}
        run: composer validate --no-check-publish

      - name: Install project dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
        with:
          working-directory: ${{ inputs.working_directory }}
          composer-options: --prefer-dist --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: Detect package.json
        id: node
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          test -f "$WD/package.json" && echo "enabled=true" >> "$GITHUB_OUTPUT" || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Detect package manager
        id: package-manager
        if: ${{ steps.node.outputs.enabled == 'true' }}
        shell: bash
        env:
          WD: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          path_for() {
            if [ "$WD" = "." ]; then
              printf '%s' "$1"
            else
              printf '%s/%s' "${WD%/}" "$1"
            fi
          }

          if [ -f "$(path_for pnpm-lock.yaml)" ]; then
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for yarn.lock)" ]; then
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for yarn.lock)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for package-lock.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for package-lock.json)" >> "$GITHUB_OUTPUT"
          elif [ -f "$(path_for npm-shrinkwrap.json)" ]; then
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$(path_for npm-shrinkwrap.json)" >> "$GITHUB_OUTPUT"
          else
            echo "cache=" >> "$GITHUB_OUTPUT"
            echo "lockfile=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: ${{ steps.node.outputs.enabled == 'true' && steps.package-manager.outputs.cache == '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}

      - name: Set up Node with cache
        if: ${{ steps.node.outputs.enabled == 'true' && steps.package-manager.outputs.cache != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}
          cache: ${{ steps.package-manager.outputs.cache }}
          cache-dependency-path: ${{ steps.package-manager.outputs.lockfile }}

      - name: Build Node assets
        if: ${{ steps.node.outputs.enabled == 'true' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          BUILD_SCRIPT: ${{ inputs.build_script }}
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable || yarn install --frozen-lockfile
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts[process.env.BUILD_SCRIPT] ? 0 : 1)"; then
            if [ -f pnpm-lock.yaml ]; then
              pnpm "$BUILD_SCRIPT"
            elif [ -f yarn.lock ]; then
              yarn "$BUILD_SCRIPT"
            else
              npm run "$BUILD_SCRIPT"
            fi
          fi

      - name: Install deployment dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
        with:
          working-directory: ${{ inputs.deployment_directory }}
          composer-options: --prefer-dist --no-progress --no-interaction

      - name: Configure SSH known hosts
        env:
          DEPLOY_HOSTNAME: ${{ secrets.DEPLOY_HOSTNAME }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          ALLOW_SSH_KEYSCAN: ${{ inputs.allow_ssh_keyscan }}
        if: ${{ env.DEPLOY_HOSTNAME != '' || env.SSH_KNOWN_HOSTS != '' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
            exit 0
          fi

          if [ "$ALLOW_SSH_KEYSCAN" != "true" ]; then
            echo "::error::SSH_KNOWN_HOSTS is required unless allow_ssh_keyscan=true is explicitly set."
            exit 1
          fi

          port="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$port" "$DEPLOY_HOSTNAME" >> ~/.ssh/known_hosts

      - name: Run Deployer
        id: run-deployer
        continue-on-error: true
        working-directory: ${{ inputs.deployment_directory }}
        shell: bash
        env:
          DEPLOY_HOSTNAME: ${{ secrets.DEPLOY_HOSTNAME }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_VERBOSITY: ${{ inputs.verbosity }}
          DEPLOY_COMMAND: ${{ inputs.deploy_command }}
          ALLOW_CUSTOM_DEPLOY_COMMAND: ${{ inputs.allow_custom_deploy_command }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_COMMAND" != "./vendor/bin/dep deploy" ] && [ "$ALLOW_CUSTOM_DEPLOY_COMMAND" != "true" ]; then
            echo "::error::deploy_command is restricted by default. Set allow_custom_deploy_command=true only for trusted workflow calls."
            exit 1
          fi

          if [[ ! "$DEPLOY_ENVIRONMENT" =~ ^[A-Za-z0-9_.:-]+$ ]]; then
            echo "::error::environment may only contain letters, numbers, dots, underscores, colons, and hyphens."
            exit 1
          fi

          if [[ ! "$DEPLOY_VERBOSITY" =~ ^v{0,3}$ ]]; then
            echo "::error::verbosity must be empty, v, vv, or vvv."
            exit 1
          fi

          set +e
          log_file="${RUNNER_TEMP}/deployer.log"
          bash -lc "$DEPLOY_COMMAND $DEPLOY_ENVIRONMENT -$DEPLOY_VERBOSITY" 2>&1 | tee "$log_file"
          exit_code="${PIPESTATUS[0]}"
          set -e

          warnings="$(grep -Ei '(^|[[:space:]])(warning|warn|deprecated|notice)(:|\\])' "$log_file" || true)"
          if [ "$exit_code" -eq 0 ]; then
            reason="Deployment completed successfully."
          elif [ "$exit_code" -eq 2 ]; then
            reason="$(printf '%s\n' "$warnings" | head -n 1)"
            reason="${reason:-Deployment completed with warnings.}"
          else
            reason="$(grep -Ei '(^|[[:space:]])(error|critical|failed)(:|\\])' "$log_file" | head -n 1 || true)"
            reason="${reason:-Deployment failed.}"
          fi

          {
            echo "exit_code=$exit_code"
            echo "reason<<DEPLOY_REASON"
            printf '%s\n' "$reason"
            echo "DEPLOY_REASON"
            echo "warnings<<DEPLOY_WARNINGS"
            printf '%s\n' "$warnings" | head -n 40
            echo "DEPLOY_WARNINGS"
            echo "log_excerpt<<DEPLOY_LOG"
            tail -n 120 "$log_file"
            echo "DEPLOY_LOG"
          } >> "$GITHUB_OUTPUT"

          exit "$exit_code"

      - name: Stop WireGuard
        if: ${{ always() }}
        run: |
          if [ -f /etc/wireguard/wg0.conf ]; then
            sudo wg-quick down wg0 || true
          fi

      - name: Fail on Deployer result
        if: ${{ always() && steps.run-deployer.outputs.exit_code != '' && steps.run-deployer.outputs.exit_code != '0' }}
        shell: bash
        env:
          EXIT_CODE: ${{ steps.run-deployer.outputs.exit_code }}
          DEPLOY_REASON: ${{ steps.run-deployer.outputs.reason }}
        run: |
          echo "::error::${DEPLOY_REASON}"
          exit "$EXIT_CODE"
