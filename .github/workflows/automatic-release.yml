name: Automatic release

on:
  workflow_call:
    inputs:
      node_version:
        description: Node version used for semantic-release.
        type: string
        default: '24'
        required: false
      npm_registry_domain:
        description: npm registry URL.
        type: string
        default: https://npm.pkg.github.com/
        required: false
      release_config:
        description: Release config path in the calling repository.
        type: string
        default: release.config.cjs
        required: false
      workflow_repository:
        description: Repository containing fallback release templates.
        type: string
        default: sympress/workflows
        required: false
      workflow_ref:
        description: Ref used when checking out fallback release templates.
        type: string
        default: v1
        required: false
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 10
        required: false
    secrets:
      NPM_REGISTRY_TOKEN:
        description: npm registry token.
        required: false
      GITHUB_USER_EMAIL:
        description: Git author email.
        required: false
      GITHUB_USER_NAME:
        description: Git author name.
        required: false
      GITHUB_USER_SSH_KEY:
        description: Optional SSH key for git operations.
        required: false
      GITHUB_USER_SSH_PUBLIC_KEY:
        description: Optional SSH public key for commit signing.
        required: false
      GITHUB_USER_TOKEN:
        description: Token with release permissions. Falls back to GITHUB_TOKEN.
        required: false

permissions:
  contents: read

jobs:
  automatic-release:
    name: Automatic release
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git author
        shell: bash
        env:
          GIT_EMAIL: ${{ secrets.GITHUB_USER_EMAIL }}
          GIT_NAME: ${{ secrets.GITHUB_USER_NAME }}
        run: |
          set -euo pipefail
          git config user.email "${GIT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git config user.name "${GIT_NAME:-github-actions[bot]}"

      - name: Detect release config
        id: release-config
        shell: bash
        env:
          RELEASE_CONFIG: ${{ inputs.release_config }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CONFIG" = /* || "$RELEASE_CONFIG" == *..* || ! "$RELEASE_CONFIG" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::release_config must be a repository-relative path using only letters, numbers, dots, underscores, hyphens, and slashes."
            exit 1
          fi
          if [ -f "$RELEASE_CONFIG" ]; then
            echo "has_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_config=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout workflow templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.workflow_repository }}
          ref: ${{ inputs.workflow_ref }}
          path: .workflow-templates
          persist-credentials: false

      - name: Install fallback release config
        if: ${{ steps.release-config.outputs.has_config == 'false' }}
        shell: bash
        env:
          RELEASE_CONFIG: ${{ inputs.release_config }}
        run: |
          set -euo pipefail
          mkdir -p .release
          cp .workflow-templates/templates/automatic-release/release.config.cjs "$RELEASE_CONFIG"
          cp .workflow-templates/templates/automatic-release/update-version.cjs .release/update-version.cjs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_domain }}

      - name: Install locked release tooling
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tools_dir="${RUNNER_TEMP}/sympress-release-tools"
          mkdir -p "$tools_dir"
          cp .workflow-templates/templates/automatic-release/package{,-lock}.json "$tools_dir/"
          cp .workflow-templates/templates/automatic-release/{run-release,github-auth-plugin}.mjs "$tools_dir/"
          cp .workflow-templates/templates/automatic-release/sympress-bounded-braces-1.0.0.tgz "$tools_dir/"
          cp -R .workflow-templates/templates/automatic-release/disabled-npm-plugin "$tools_dir/"
          npm ci --prefix "$tools_dir" --ignore-scripts --no-audit
          rm -rf .workflow-templates

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.GITHUB_USER_SSH_KEY }}
        if: ${{ env.SSH_KEY != '' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ env.SSH_KEY }}

      - name: Configure SSH remote
        env:
          SSH_KEY: ${{ secrets.GITHUB_USER_SSH_KEY }}
        if: ${{ env.SSH_KEY != '' }}
        run: git remote set-url origin "git@github.com:${{ github.repository }}.git"

      - name: Configure SSH commit signing
        env:
          SSH_PUBLIC_KEY: ${{ secrets.GITHUB_USER_SSH_PUBLIC_KEY }}
        if: ${{ env.SSH_PUBLIC_KEY != '' }}
        run: |
          umask 077
          touch "${{ runner.temp }}/signingkey"
          printf '%s\n' "$SSH_PUBLIC_KEY" > "${{ runner.temp }}/signingkey.pub"
          git config commit.gpgsign true
          git config gpg.format ssh
          git config user.signingkey "${{ runner.temp }}/signingkey.pub"

      - name: Release
        shell: bash
        env:
          SYMPRESS_RELEASE_TOKEN: ${{ secrets.GITHUB_USER_TOKEN || github.token }}
          NPM_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
          RELEASE_CONFIG: ${{ inputs.release_config }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          helper="$(mktemp)"
          trap 'rm -f "$helper"' EXIT
          cat > "$helper" <<'HELPER'
          #!/bin/sh
          protocol= host=
          while IFS='=' read -r name value; do
            case "$name" in
              protocol) protocol="$value" ;;
              host) host="$value" ;;
              '') break ;;
            esac
          done
          if [ "$1" = get ] && [ "$protocol" = https ] && [ "$host" = github.com ]; then
            printf 'username=x-access-token\npassword=%s\n' "$SYMPRESS_RELEASE_TOKEN"
          fi
          HELPER
          chmod 700 "$helper"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0="$helper" GIT_TERMINAL_PROMPT=0
          if [[ "$(git remote get-url origin)" != git@* ]]; then
            git remote set-url origin "https://github.com/${REPOSITORY}.git"
          fi
          export NODE_PATH="${RUNNER_TEMP}/sympress-release-tools/node_modules"
          node "${RUNNER_TEMP}/sympress-release-tools/run-release.mjs"

      - name: Remove release credentials and tooling
        if: ${{ always() }}
        shell: bash
        run: |
          ssh-add -D >/dev/null 2>&1 || true
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            kill "$SSH_AGENT_PID" || true
          fi
          rm -f "${RUNNER_TEMP}/signingkey" "${RUNNER_TEMP}/signingkey.pub"
          rm -rf "${RUNNER_TEMP}/sympress-release-tools" .workflow-templates
