name: Archive And QIT

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  archive:
    uses: sympress/workflows/.github/workflows/wordpress-archive.yml@a258c0d9d040c8c1e682d62ef7ed34c82569df6c # v1.4.0
    with:
      package_version: ${{ github.ref_name }}

  qit:
    needs: archive
    uses: sympress/workflows/.github/workflows/woo-qit.yml@a258c0d9d040c8c1e682d62ef7ed34c82569df6c # v1.4.0
    with:
      artifact_name: ${{ needs.archive.outputs.artifact }}
      qit_test: activation
    secrets:
      WOO_PARTNER_USER: ${{ secrets.WOO_PARTNER_USER }}
      WOO_PARTNER_SECRET: ${{ secrets.WOO_PARTNER_SECRET }}
