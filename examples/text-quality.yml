name: Text Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  text-quality:
    uses: sympress/workflows/.github/workflows/text-quality.yml@a258c0d9d040c8c1e682d62ef7ed34c82569df6c # v1.4.0
    with:
      cspell_config: cspell.json
      run_grammar: ${{ github.event_name == 'pull_request' }}
