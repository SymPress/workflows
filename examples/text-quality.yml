name: Text Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  text-quality:
    uses: sympress/workflows/.github/workflows/text-quality.yml@8f03d8b2520e366e5d7cc3398e0c368ccb83e311 # v1.3.0
    with:
      cspell_config: cspell.json
      run_grammar: ${{ github.event_name == 'pull_request' }}
