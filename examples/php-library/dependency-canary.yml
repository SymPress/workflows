name: Dependency compatibility

on:
  schedule:
    - cron: '17 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    permissions:
      contents: read
      issues: write
    uses: sympress/workflows/.github/workflows/dependency-canary.yml@REVIEWED_COMMIT_SHA
    with:
      php_version: '8.5'
