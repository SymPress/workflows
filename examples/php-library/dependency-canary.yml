name: Dependency compatibility

on:
  schedule:
    - cron: '17 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    permissions:
      contents: read
      issues: write
    uses: sympress/workflows/.github/workflows/dependency-canary.yml@4d668133403d357d8335fdbfb850bb13a9105ece # v2.0.0
    with:
      php_version: '8.5'
