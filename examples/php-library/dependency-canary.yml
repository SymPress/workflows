name: Dependency compatibility

on:
  schedule:
    - cron: '17 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    permissions:
      contents: read
      issues: write
    uses: sympress/workflows/.github/workflows/dependency-canary.yml@a258c0d9d040c8c1e682d62ef7ed34c82569df6c # v1.4.0
    with:
      php_version: '8.5'
