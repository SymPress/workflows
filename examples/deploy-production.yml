name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: sympress/workflows/.github/workflows/deploy-deployer.yml@a258c0d9d040c8c1e682d62ef7ed34c82569df6c # v1.4.0
    with:
      environment: production
      allowed_refs: refs/heads/main refs/tags/v*
      deployment_directory: deployment
    # GITHUB_USER_SSH_KEY, SSH_KNOWN_HOSTS, DEPLOY_HOSTNAME and DEPLOY_USER are
    # environment secrets of "production" (see docs/deploy.md), not passed here.
    secrets:
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}
