name: Monorepo QA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    uses: sympress/workflows/.github/workflows/sympress-qa.yml@4d668133403d357d8335fdbfb850bb13a9105ece # v2.0.0
    with:
      include_root: true
      package_glob: packages/*
      php_version: '8.5'
