name: QA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    uses: sympress/workflows/.github/workflows/sympress-qa.yml@a258c0d9d040c8c1e682d62ef7ed34c82569df6c # v1.4.0
    with:
      php_version: '8.5'
    secrets:
      SSH_KEY: ${{ secrets.COMPOSER_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.COMPOSER_SSH_KNOWN_HOSTS }}
