name: Release

on:
  push:
    branches:
      - main
      - beta
      - alpha

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: sympress/workflows/.github/workflows/automatic-release.yml@a258c0d9d040c8c1e682d62ef7ed34c82569df6c # v1.4.0
    secrets:
      GITHUB_USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
